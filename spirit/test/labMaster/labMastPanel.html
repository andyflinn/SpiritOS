<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>labMaster</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.35rem 0.5rem; text-align: left; }
    .row-actions button { margin-right: 0.25rem; }
    /* Below the table, and able to hold several lines: recycle-all
       answers once per node and a one-line box would show only the last. */
    #status { margin: 1rem 0 0; min-height: 1.2em; white-space: pre-wrap; font-family: monospace; }
    label { margin-right: 0.75rem; }
    .bulk { margin: 0.75rem 0; }
  </style>
</head>
<body>
  <h1>labMaster</h1>
  <p>Fixed bookmark: <code>http://localhost:65420</code>. Work node is port 65432 and cannot be deleted.</p>
  <div>
    <label>Name <input id="new-name" placeholder="andy"></label>
    <label>Type
      <select id="new-type">
        <option value="avatar">avatar</option>
        <option value="relay">relay</option>
      </select>
    </label>
    <label>Port <input id="new-port" type="number" min="65400" max="65429" placeholder="65400"></label>
    <button type="button" id="create">Create</button>
  </div>
  <div class="bulk">
    <button type="button" id="recycle-all">Recycle all</button>
    <small>every node but the work node, one at a time</small>
  </div>
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Type</th><th>Port</th><th>Running</th><th>Connected to</th><th>Home</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="status"></div>
  <script>
    var statusEl = document.getElementById('status');
    function setStatus(t) { statusEl.textContent = t; }

    function api(method, path, body) {
      var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      return fetch(path, opts).then(function (r) {
        return r.text().then(function (t) {
          var parsed;
          try { parsed = t ? JSON.parse(t) : {}; } catch (e) { parsed = { raw: t }; }
          return { status: r.status, body: parsed };
        });
      });
    }

    function render(nodes) {
      var tbody = document.getElementById('tbody');
      tbody.innerHTML = nodes.map(function (n) {
        var del = n.permanent
          ? ''
          : '<button data-act="recycle" data-id="' + n.id + '">Recycle</button>' +
            '<button data-act="delete" data-id="' + n.id + '">Delete</button>';

            var label = n.name + (n.permanent ? ' <small>permanent</small>' : '');
            var nameCell = n.running
            ? '<a href="http://localhost:' + n.port + '" target="_blank" rel="noopener">' + label + '</a>'
            : label;
        // Seven cells for seven headings. Count them against the <th>
        // row above before adding one: an earlier version drew `label`
        // twice and every column after it sat under the wrong heading.
        var link = links[n.id];
        var linkCell = '<small>—</small>';
        if (link && link.relays && link.relays.length) {
          linkCell = '<small>' + link.relays.map(function (r) {
            var host = r.url.replace(/^https?:\/\//, '');
            return (r.up ? '\u25CF ' : '\u25CB ') + host;
          }).join('<br>') +
            '<br>' + link.reachable + ' of ' + link.known + ' reachable</small>';
        }
        return '<tr>' +
          '<td>' + nameCell + '</td>' +
          '<td>' + n.type + '</td>' +
          '<td>' + n.port + '</td>' +
          '<td>' + (n.running ? 'yes' : 'no') + (n.lastError ? ' ' + n.lastError : '') + '</td>' +
          '<td>' + linkCell + '</td>' +
          '<td><small>' + n.home + '</small></td>' +
          '<td class="row-actions">' +
            '<button data-act="start" data-id="' + n.id + '">Start</button>' +
            '<button data-act="stop" data-id="' + n.id + '">Stop</button>' +
            del +
          '</td></tr>';
      }).join('');
    }

    // What each node says about its own connections. Asked alongside the
    // node list rather than folded into it, so a slow or wedged node
    // delays one cell instead of the whole table.
    var links = {};

    function refresh() {
      return api('GET', '/api/nodes').then(function (r) {
        var rows = (r.body && r.body.nodes) || [];
        render(rows);
        return api('GET', '/api/links').then(function (l) {
          links = (l.body && l.body.links) || {};
          render(rows);
        }).catch(function () { /* the column stays blank, the table does not */ });
      }).catch(function (e) { setStatus('refresh failed: ' + e.message); });
    }

    // One at a time, on purpose: a recycle stops a process, recopies the
    // tree and starts it again, and firing a dozen at once would have them
    // competing over the same fakes root. Sequential is also what makes the
    // answers readable — one line per node, in the order it was done.
    document.getElementById('recycle-all').addEventListener('click', function () {
      var button = this;
      button.disabled = true;
      setStatus('recycling…');
      api('GET', '/api/nodes').then(function (r) {
        var all = (r.body && r.body.nodes) || [];
        // The work node refuses recycle server-side (403, "cannot recycle
        // work node"). Skipping it here means the log reports what was
        // done rather than one guaranteed failure every time.
        var targets = all.filter(function (n) { return !n.permanent; });
        if (!targets.length) return ['nothing to recycle'];
        var lines = [];
        return targets.reduce(function (chain, n) {
          return chain.then(function () {
            return api('POST', '/api/nodes/' + n.id + '/recycle', {}).then(function (res) {
              lines.push(n.name + ' (' + n.port + ') → ' + res.status + ' ' +
                (res.body && res.body.error ? res.body.error : 'ok'));
              setStatus(lines.join('\n'));
            });
          });
        }, Promise.resolve()).then(function () { return lines; });
      }).then(function (lines) {
        setStatus(lines.join('\n'));
        button.disabled = false;
        return refresh();
      }).catch(function (e) {
        setStatus('recycle all failed: ' + e.message);
        button.disabled = false;
      });
    });

    document.getElementById('create').addEventListener('click', function () {
      var body = {
        name: document.getElementById('new-name').value,
        type: document.getElementById('new-type').value,
        port: Number(document.getElementById('new-port').value)
      };
      api('POST', '/api/nodes', body).then(function (r) {
        setStatus(r.status + ' ' + JSON.stringify(r.body));
        return refresh();
      });
    });

    document.getElementById('tbody').addEventListener('click', function (e) {
      var act = e.target.getAttribute('data-act');
      var id = e.target.getAttribute('data-id');
      if (!act || !id) return;
      api('POST', '/api/nodes/' + id + '/' + act, {}).then(function (r) {
        setStatus(r.status + ' ' + JSON.stringify(r.body));
        return refresh();
      });
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
