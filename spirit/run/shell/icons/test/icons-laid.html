<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shell.css">
<style>body { margin: 0; }</style>
</head>
<body>
<script src="/spirit.js"></script>
<script>
// goal/G41.27 (Andy: "icons app:\n[➕] [an icon:paste] [keywords, comma separated][Add]"; the box: "new shell element:
// rowForm",
// "spirit.elements.rowForm.create(container, { icon, button }) -> { root, span, button }", "a line saying what
// a press did (a refusal, a result) is the mounter's, below the bubble, not in it."): the icons app mounted in a box, the
// rowForm it makes recorded, and what the browser makes of its add row, measured. Opened by ./icons.js at
// /DEBUG/shell/icons/test/icons-laid.html.
window.laid = function () {
  var made = [];
  var def = null;
  spirit.shell = spirit.shell || {};
  spirit.shell.activateApp = function (d) { def = d; };
  return spirit.require('spirit/element/rowForm.js').catch(function () { return null; }).then(function () {
    // The real rowForm, each form it makes kept as made.
    var R = (spirit.element || {}).rowForm;
    if (R && typeof R.create === 'function') {
      var real = R.create;
      R.create = function (c, o) { var f = real.call(R, c, o); made.push({ opts: o || {}, f: f }); return f; };
    }
    return spirit.require('shell/icons/icons.js');
  }).catch(function () { return null; }).then(function () {
    var out = { app: !!def && typeof def.mount === 'function' };
    if (!out.app) return JSON.stringify(out);
    var box = document.createElement('div');
    box.style.cssText = 'width:600px;height:400px;display:flex;flex-direction:column';
    document.body.appendChild(box);
    var api = { verb: function () { return Promise.resolve({ status: 200, body: { items: [], more: false } }); }, onPublished: function () { return function () {}; } };
    return Promise.resolve().then(function () { return def.mount(box, api); }).catch(function () { return null; }).then(function () {
      return new Promise(function (r) { setTimeout(r, 300); });
    }).then(function () {
      out.forms = made.map(function (m) { return { icon: m.opts.icon, button: m.opts.button, inBox: box.contains(m.f.root) }; });
      var f = made[0] ? made[0].f : null;
      if (f) {
        var kids = Array.prototype.slice.call(f.span.children);
        out.span = kids.map(function (k) { return { tag: k.tagName, type: k.type || '', placeholder: k.getAttribute('placeholder') || '' }; });
        out.spanInputs = f.span.querySelectorAll('input').length;
        var adds = Array.prototype.slice.call(box.querySelectorAll('button')).filter(function (b) { return /^\s*Add\s*$/.test(b.textContent); });
        out.adds = adds.length; out.addIsForm = adds[0] === f.button;
        // Its first row: the form before the list's pane.
        var pane = box.querySelector('[data-icons="pane"]') || null;
        out.formFirst = !pane || (f.root.compareDocumentPosition(pane) & 4) !== 0;
        // A press with no glyph says so, on a line that is not in the bubble.
        f.button.click();
        var said = Array.prototype.slice.call(box.querySelectorAll('*')).filter(function (el) { return /paste an icon first/.test(el.textContent) && !el.children.length; })[0] || null;
        out.said = said ? said.textContent : '';
        out.saidInBubble = !!said && f.root.contains(said);
        out.saidBelow = !!said && f.root.getBoundingClientRect().bottom <= said.getBoundingClientRect().top + 0.5;
      }
      return JSON.stringify(out);
    });
  });
};
</script>
</body>
</html>
