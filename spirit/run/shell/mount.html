<!doctype html>
<!-- spirit/run/shell/mount.html
     THE BARE MOUNT PAGE (goal/G41.18): one shell app or element, mounted alone, for the general rules of the shell
     (shell/test/boot-sibling-generalRules.md). Andy: "who says it shouln't check general \"mountability\" of elements and
     apps?", "mount each element or app all by itself". It loads /shell.css and /spirit.js and nothing else of the shell,
     so a file that uses a part it did not require itself fails here (rule/26). The file is ?file=<its run path>.
       An app (it calls spirit.shell.activateApp) is mounted into the box with an api as the face gives an app.
       An element is made as the JSON beside its tests says, <its folder>/test/<its name>-boot-sibling-generalRules.json:
       { create, options }, spirit.elements[create].create(box, options).
     What happened is on window.spiritMount: { state: loading | mounted | failed, error, box, panes, destroy }. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mount</title>
  <link rel="stylesheet" href="/shell.css" />
  <style>html, body { height: 100%; margin: 0; } body { display: flex; flex-direction: column; }</style>
</head>
<body>
  <div id="mount-box" class="fill"></div>
  <script src="/spirit.js"></script>
  <script>
  (function () {
    var box = document.getElementById('mount-box');
    var report = window.spiritMount = { state: 'loading', error: '', box: box, panes: [], destroy: null };
    function failed(e) { report.state = 'failed'; report.error = String((e && e.message) || e || 'failed'); }
    var file = '';
    try { file = new URLSearchParams(window.location.search).get('file') || ''; } catch (e) { file = ''; }
    if (!/^shell\/[A-Za-z0-9_\/.-]+\.js$/.test(file) || file.indexOf('..') !== -1) { failed('no shell file named: ?file=shell/<path>.js'); return; }

    // EVERY LIST MADE IN PANE MODE IS KEPT: probabilitySearch, once some part has required it, has its create watched, a
    // dropdown left out.
    var E = (window.spirit = window.spirit || {}).elements = window.spirit.elements || {};
    var search = E.probabilitySearch;
    function watched(ps) {
      if (!ps || ps.spiritMountWatched || typeof ps.create !== 'function') return ps;
      var create = ps.create;
      ps.create = function (host, o) {
        if (!(o && o.face === 'dropdown')) report.panes.push(host);
        return create.apply(this, arguments);
      };
      ps.spiritMountWatched = true;
      return ps;
    }
    Object.defineProperty(E, 'probabilitySearch', { configurable: true, enumerable: true,
      get: function () { return search; }, set: function (v) { search = watched(v); } });

    // AN APP IS HANDED ITS BOX AND AN API as the face shell hands one (shell/boot.js apiFor): its calls go to the home
    // node through the spirit object, and the navigation's own parts are no-ops here.
    function ask(verb, args) {
      var name = String(verb);
      var dot = name.indexOf('.');
      var fam = dot > 0 ? spirit[name.slice(0, dot)] : null;
      var fn = fam && typeof fam[name.slice(dot + 1)] === 'function' ? fam[name.slice(dot + 1)] : null;
      if (!fn) return Promise.resolve({ status: 400, text: '', body: { ok: false, code: 'no-such-verb', error: 'no verb ' + name } });
      return spirit.outcome(fn(args || {})).then(function (o) { return { status: o.status, text: o.body == null ? '' : JSON.stringify(o.body), body: o.body }; });
    }
    var api = {
      escapeHtml: spirit.escapeHtml,
      verb: ask,
      launchApp: function () {}, callDialog: function () { return Promise.resolve(); }, closeDialog: function () {},
      setScreenTitle: function () {}, setScreenMark: function () {}, addTitlebarLink: function () {},
      armUntilElsewhere: function () {}, isVisible: function () { return true; },
      onJobs: function () { return function () {}; }, onFiles: function () { return function () {}; }, onRelayEvent: function () { return function () {}; },
      ui: { elements: E },
    };
    var app = null;
    (spirit.shell = spirit.shell || {}).activateApp = function (behavior) { app = behavior; };

    Promise.resolve(spirit.start()).then(function () { return spirit.require(file); }).then(function () {
      if (app && typeof app.mount === 'function') {
        app.mount(box, api);
        if (typeof app.render === 'function') app.render();
        report.state = 'mounted';
        return;
      }
      // AN ELEMENT IS MADE AS THE JSON BESIDE ITS TESTS SAYS (Andy: "so the test folder needs a
      // <module>-shell-child-<testname>.json if it has special call or mount requirements for that test?", "i proposed
      // making it a json file", "and a script invites cheating...."): { create, options }. JSON holds no function, so in
      // the options { "answers": X } is a function answering X, and { "page": "api" } is this page's api.
      var slash = file.lastIndexOf('/');
      var needs = file.slice(0, slash) + '/test/' + file.slice(slash + 1).replace(/\.js$/, '') + '-boot-sibling-generalRules.json';
      function made(v) {
        if (Array.isArray(v)) return v.map(made);
        if (!v || typeof v !== 'object') return v;
        var keys = Object.keys(v);
        if (keys.length === 1 && keys[0] === 'answers') { var x = v.answers; return function () { return Promise.resolve(x); }; }
        if (keys.length === 1 && keys[0] === 'page' && v.page === 'api') return api;
        var out = {};
        keys.forEach(function (k) { out[k] = made(v[k]); });
        return out;
      }
      return fetch('/' + needs, { credentials: 'same-origin' }).then(function (r) {
        if (r.status !== 200) throw new Error('an element mounts as ' + needs + ' says, and there is none');
        return r.json();
      }).then(function (how) {
        var el = how && how.create ? E[how.create] : null;
        if (!el || typeof el.create !== 'function') throw new Error(needs + ' names no element to create: ' + (how && how.create));
        return el.create(box, made(how.options || {}));
      }).then(function (made) {
        if (made && typeof made.destroy === 'function') report.destroy = function () { return made.destroy(); };
        report.state = 'mounted';
      });
    }).then(null, failed);
  }());
  </script>
</body>
</html>
