<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SpiritOS — this device</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    form, #attached { display: flex; flex-direction: column; gap: 0.75rem; }
    input, textarea { font: inherit; padding: 0.5rem; width: 100%; box-sizing: border-box; }
    button { font: inherit; padding: 0.5rem 0.75rem; width: fit-content; }
    #log { white-space: pre-wrap; min-height: 8rem; border: 1px solid #ccc; padding: 0.5rem; }
    /* Two lines while waiting: what is happening, and the fact that
       explains it. Neither is worth a second element. */
    #enroll-out { white-space: pre-line; }
    .hide { display: none !important; }
    /* Stated, not asked: it reads as the fact it is rather than a field
       somebody is meant to fill in. */
    input[readonly] { background: #f2f2f2; color: #555; border-style: dotted; }

    /* ── THE ACCOUNT NAME IS A HEADING, NOT A FIELD ──────────────────
         Andy: "styled more like a heading".

       It is one fixed word that is the same on every device page there
       will ever be, and nothing here can change it. Left looking like an
       input it invites a try — a dotted grey box still reads as
       something that might accept typing, and somebody who types into it
       and fails has learned nothing about why.

       IT REMAINS AN <input>, because the browser's password manager only
       sees a username in a real field: this is the one element on the
       page whose purpose is served by something other than a reader. So
       the field is kept and its chrome is taken away. */
    .account input[readonly] {
      background: none;
      border: none;
      padding: 0;
      color: #111;
      font-size: 1.15rem;
      font-weight: 600;
      /* Not for reading so much as for recognising: it is quoted
         verbatim in the instructions, so it should look the same here as
         it does there. */
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <h1>This device</h1>

  <form id="enroll" autocomplete="on">
    <!--
      THERE IS NO LISTENING. This said "works only while listening is on
      at that personal node", which was true of a design with a window
      and a poll behind it and has been false since 2026-09-12 — a node
      with a password can be enrolled to, always. The sentence outlived
      the mechanism by a day and told somebody to go and switch on a
      control that no longer exists.

      What replaces it is the one thing a person standing here can
      actually act on: the password has to be the one that node is
      showing NOW. A browser offers the saved one, and a rotated password
      makes the saved one wrong while looking exactly as right.
    -->
    <p>Adding a device on <strong id="host">this relay</strong>.
       Use the password that node is showing now — if it was changed, the
       one your browser saved is out of date.</p>
    <!--
      Restored after the cycle-5 drop replaced this page (df891bf).
      Chrome saves a lone password field unreliably and offers it back
      less reliably still — and remembering it IS how the password gets
      to the other device, copied once and synced, never typed.

      ── A CONSTANT AGAIN, AND DELIBERATELY ─────────────────────────
      THIS SUPERSEDES the note that stood here and PEER-DEVICES.md
      section 5, both of which called for the PUBLIC LABEL in this
      field. The reasoning there still holds as far as it goes: browsers
      key saved credentials by origin, one relay carries many identities
      on one origin, so the username is the only field that can separate
      them — the picker problem Andy had, "difficult to select from 13
      usernames".

      THE GROUND MOVED; THE REASONING DID NOT FAIL. Andy:

        "when we last changed the logic, it was the relay's 'handle' for
        our ID, which stayed constant at the time, that's why it worked.
        but now, since we change our node's public label on the relay,
        that no longer was true."

      A relay handle that never changed was a perfectly good key for a
      saved credential. Then Info grew "one name, sent everywhere" —
      relay.renameSelf to every relay you hold a seat on, infoPush in
      app/info/info.js — and the field this page had chosen for being
      stable became the field the product exists to let you change.

      A renamed label does not rename a saved credential; it mints a NEW
      one. So the picker fills with the history of what you have called
      yourself, every entry holding the same password. The fix for a
      crowded picker had become the thing that crowds it.

        Andy: "make the Account Field a constant, something explanatory
        like 'MyDeviceAccountPassword'... so that 1) we generate only
        one account/password entry for the browser password manager, and
        2) our documentation of this process is always correct when we
        say 'MyDeviceAccountPassword'."

      DECIDED BY ANDY, with the cost stated first: several nodes of your
      own enrolled against ONE relay now share this name, and the picker
      cannot tell them apart.

      THE MITIGATION WAS WITHDRAWN ON 2026-09-17. This said "what tells
      them apart is the sentence above, which still names the identity",
      and that sentence is gone:

        Andy: "the page fulfills its function without being cute and
        showing a label that the user already knows. Unnecessary for
        functionality. Kill it." — "the page posts a constant username
        and a pasted secret. That's all."

      So nothing on the page distinguishes one of your nodes from
      another; the LINK you followed does, and that is where the choice
      was made. The label never did the job it appeared to anyway — a
      name printed by the page comes from whoever served the page.

      THE STRING IS PART OF THE DOCUMENTATION. Changing it silently
      breaks every instruction that quotes it and mints everyone a
      second entry, which is why deviceAccount.js asserts it exactly.

      Stated rather than asked: readonly and out of the tab order, and
      styled as a heading rather than a field, because there is nothing
      here to fill in.
    -->
    <label class="account">Account
      <input id="user" type="text" name="username" autocomplete="username"
             value="MyDeviceAccountPassword" readonly tabindex="-1">
    </label>
    <label>Password
      <input id="pw" type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Add this device</button>
    <p id="enroll-out"></p>
  </form>

  <div id="attached" class="hide">
    <p id="who"></p>
    <div id="log"></div>
  </div>

  <script>
    (function () {
      var enroll = document.getElementById('enroll');
      var enrollOut = document.getElementById('enroll-out');
      var attachedEl = document.getElementById('attached');
      var whoEl = document.getElementById('who');
      var logEl = document.getElementById('log');

      // Whatever host actually served this page. Not baked in: the same
      // file is served by every relay its owner runs.
      document.getElementById('host').textContent = location.host;

      // WHOSE PAGE THIS IS, read off our own address. `/<key>/device`
      // carries the identity; the bare `/device` carries none and the
      // relay reads that as the owner, which is what it has always done.
      //
      // The segment is a base64url key (deviceAuth.keyToUrl). It is sent
      // back untouched — the relay is the one place that translates it,
      // so the page never has to know the stored form.
      //
      // A locator, not a credential: every key here is already public at
      // /api/relay/who, and holding one in the URL grants nothing. What
      // authorises is the password, and after that the signature.
      var enrollFor = (function () {
        var m = /^\/([A-Za-z0-9_-]{16,512})\/device\/?$/.exec(location.pathname);
        return m ? m[1] : '';
      })();

      // ── THE PAGE ASKS THE RELAY NOTHING (2026-09-17) ──────────────
      //
      //   Andy: "the important part of the chrome on that page is the
      //   constant, the name that identifies the label for their password
      //   manager. The page fulfills its function without being cute and
      //   showing a label that the user already knows. Unnecessary for
      //   functionality. Kill it."
      //
      // A fetch stood here to put this node's public label into the first
      // sentence — "Adding a device for Jazzmin Thut on …". It read the
      // relay's whole roll to find one row, then (briefly, the same
      // day) one row by key. Both were a request for chrome.
      //
      // It could not do the job it looked like it was doing, either. A
      // label printed by the page comes from the same party serving the
      // page, so it reassures only where the relay is already trusted —
      // which is exactly where nobody needed reassuring.
      //
      // WHAT THE PAGE DOES NEED is below and it is a constant:
      // MyDeviceAccountPassword, the same for every user on every relay,
      // so a password manager keeps ONE entry instead of a new one per
      // label change. That is the chrome that carries weight here.
      //
      // `enrollFor` stays — the enrolment POST is addressed with it. It
      // is a locator and not a credential, and it is sent back untouched
      // because the relay is the one place that translates the url-safe
      // spelling.
      //
      // With this gone, no browser reads the roll at all.

      function sayEnroll(t) { enrollOut.textContent = t; }
      function sayLog(t) {
        logEl.textContent = (logEl.textContent ? logEl.textContent + '\n' : '') + t;
      }

      function b64(buf) {
        var u = new Uint8Array(buf);
        var s = '';
        for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
        return btoa(s);
      }

      function fromB64(s) {
        var bin = atob(s);
        var u = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        return u.buffer;
      }

      function store(pub, priv, name) {
        try {
          sessionStorage.setItem('spirit-device-public', pub);
          sessionStorage.setItem('spirit-device-private', priv);
          if (name) sessionStorage.setItem('spirit-device-name', name);
        } catch (e) {}
      }

      function loadStore() {
        try {
          return {
            pub: sessionStorage.getItem('spirit-device-public'),
            priv: sessionStorage.getItem('spirit-device-private'),
            name: sessionStorage.getItem('spirit-device-name')
          };
        } catch (e) {
          return {};
        }
      }

      function showAttached(name) {
        enroll.classList.add('hide');
        attachedEl.classList.remove('hide');
        whoEl.textContent = name ? ('signed in as ' + name) : 'signed in';
      }

      async function devicePair() {
        if (!crypto.subtle || typeof crypto.subtle.generateKey !== 'function') {
          throw new Error('this browser cannot sign');
        }
        var pair = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
        var spki = await crypto.subtle.exportKey('spki', pair.publicKey);
        var pkcs8 = await crypto.subtle.exportKey('pkcs8', pair.privateKey);
        return { pub: b64(spki), priv: b64(pkcs8) };
      }

      async function signLine(privB64, message) {
        var key = await crypto.subtle.importKey(
          'pkcs8',
          fromB64(privB64),
          { name: 'Ed25519' },
          false,
          ['sign']
        );
        var bytes = new TextEncoder().encode(message);
        var sig = await crypto.subtle.sign({ name: 'Ed25519' }, key, bytes);
        return b64(sig);
      }

      function sendMessage(from, to, text) {
        return 'send\n' + from + '\n' + to + '\n' + text;
      }

      // ---- Enrolment is one round trip -----------------------------
      //
      // It was a RENDEZVOUS: the relay held one offer for 66 seconds
      // while a listening node looked every 60, and the guarantee came
      // from the arithmetic rather than from the two ever being
      // coordinated. Andy found the failure exactly the way that shape
      // predicts — "works reliably when I click 10 seconds before the
      // node polls, fails reliably 10 seconds after."
      //
      // There is no poll. The relay posts the offer down the stream the
      // node is already holding, and the node answers on the same round
      // trip — 365ms through spirit.andyflinn.com, measured. So this page
      // asks ONCE, and everything below is about reading the answer
      // rather than about waiting for one.
      //
      // The three-minute budget existed for a node that had not looked
      // yet. There is no such state now: a node that is not reachable is
      // refused at once, which is decision 0006 — a relay delivers or
      // refuses, and buffers nothing on anyone's behalf.

      // How long the relay will wait on a node that took the offer and
      // then went quiet (ROUTE_WAIT_MS, relay.js). Past this the silence
      // is the relay giving up rather than the network being slow, and
      // this page has nothing left to learn by waiting longer.
      var ENROLL_WAIT_MS = 15000;

      // 429 means the relay has taken too many attempts for this name in
      // the last minute. That is the ONE refusal it names precisely —
      // everything else it answers `not now` to, on purpose — and it is
      // temporary, so it is a reason to wait rather than to stop. Twenty
      // seconds because the bucket is a rolling minute: a third of it is
      // usually enough for a slot to fall out.
      var ENROLL_RATE_WAIT_MS = 20000;

      // THE ONLY THING LEFT WORTH RETRYING FOR, and the budget is sized
      // for it alone: two hold-offs and change. Every other answer this
      // page can get has already happened by the time it arrives, and
      // asking the same question again would only spend the rate limit.
      var ENROLL_BUDGET_MS = 60000;

      var enrollStop = null;

      function enrollClock(ms) {
        var s = Math.max(0, Math.round(ms / 1000));
        return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
      }

      function enrollButton(label) {
        var b = enroll.querySelector('button[type="submit"]');
        if (b) b.textContent = label;
      }

      function enrollRun(password, pair) {
        var began = Date.now();
        var attempt = 0;
        var cancelled = false;
        var holdOffUntil = 0;

        // A second or two of "asking…" needs no countdown. What it does
        // need is to not lie: the old text said the node looks about once
        // a minute and this page waits out several of those, and nothing
        // in that sentence is true any more.
        function paint() {
          if (holdOffUntil > Date.now()) {
            sayEnroll('This relay has taken too many enrolment attempts for this name in the ' +
              'last minute.\n' +
              'Knocking again in ' + Math.ceil((holdOffUntil - Date.now()) / 1000) +
              's. Nothing is wrong and nothing needs re-typing.');
            return;
          }
          sayEnroll('Asking your personal node — ' + enrollClock(Date.now() - began) + ' gone.\n' +
            'It is asked directly, over the connection it already holds to this relay, so ' +
            'this normally takes under a second.');
        }
        var ticker = setInterval(paint, 1000);
        var holdOff = null;

        function finish(text) {
          clearInterval(ticker);
          if (holdOff) { clearTimeout(holdOff); holdOff = null; }
          enrollStop = null;
          enrollButton('Add this device');
          sayEnroll(text);
        }

        enrollStop = function () {
          cancelled = true;
          finish('Stopped after ' + enrollClock(Date.now() - began) + '. Nothing was changed.');
        };

        function attemptOnce() {
          if (cancelled) return;
          attempt += 1;
          paint();
          var sent = Date.now();
          fetch('/api/relay/device', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: enrollFor,
              password: password,
              devicePublicKey: pair.pub
            })
          }).then(function (res) {
            return res.text().then(function (t) { return { res: res, text: t }; });
          }).then(function (r) {
            if (cancelled) return;
            var body = r.text;
            try { body = JSON.parse(r.text); } catch (e) {}

            if (r.res.ok && body && body.ok) {
              var name = body.name || '';
              clearInterval(ticker);
              enrollStop = null;
              enrollButton('Add this device');
              store(pair.pub, pair.priv, name);
              showAttached(name);
              sayEnroll('Added in ' + Math.round((Date.now() - began) / 1000) + 's.');
              sayLog('this tab is the device');
              return;
            }

            var took = Date.now() - sent;

            // The one refusal the relay names precisely, and it is not a
            // stop. Waiting it out is what a person would do anyway, and
            // the password is already typed.
            if (r.res.status === 429) {
              if (Date.now() - began >= ENROLL_BUDGET_MS) {
                finish('Gave up after ' + enrollClock(Date.now() - began) + '. This relay kept ' +
                  'refusing on rate — too many enrolment attempts for this name in the last ' +
                  'minute. Leave it a minute and press the button again.');
                return;
              }
              holdOffUntil = Date.now() + ENROLL_RATE_WAIT_MS;
              paint();
              holdOff = setTimeout(function () {
                holdOff = null;
                holdOffUntil = 0;
                attemptOnce();
              }, ENROLL_RATE_WAIT_MS);
              return;
            }

            // A NO, AND IT IS THE END OF IT. The relay says `not now` to
            // every cause on purpose — it faces the internet and owes it
            // no detail — so this lists them, and knocking again would
            // produce the identical answer.
            //
            // The ORDER matters. The first draft led with "the password
            // is wrong", which is the one cause that leaves a trace
            // somewhere else, and it is usually not the one.
            //
            // The clock separates the last case from the others: under
            // the relay's wait means something answered, at or past it
            // means the node took the offer and never came back.
            if (took < ENROLL_WAIT_MS) {
              finish('Refused in ' + Math.round(took / 1000) + 's — something answered, rather ' +
                'than nobody being there.\n' +
                'Most likely the password is out of date: if your browser filled this in, that ' +
                'is the one it SAVED, and a node whose password has changed refuses it while it ' +
                'still looks right. Open the panel in Natter on your own node, copy the password ' +
                'it is showing now, and paste it over what is in the field.\n' +
                'If that is already what you did, then your node is not connected to THIS relay ' +
                '— the same panel lists the relays it is on.');
              return;
            }

            finish('No answer after ' + enrollClock(took) + '. Your personal node is reachable ' +
              'through this relay but did not answer — it may have been shut down mid-request. ' +
              'Press the button again; the password is still filled in.');
          }).catch(function (e) {
            finish('Network error after ' + enrollClock(Date.now() - began) + ': ' +
              (e && e.message ? e.message : 'the request failed') + '.');
          });
        }

        attemptOnce();
      }

      enroll.addEventListener('submit', function (ev) {
        ev.preventDefault();
        // One button, two meanings, and the label says which. It is a
        // second's wait now rather than three minutes, and the way out
        // stays because the one case that still retries — a rate-limited
        // relay — holds this page for twenty seconds at a time.
        if (enrollStop) {
          enrollStop();
          return;
        }
        var password = document.getElementById('pw').value;
        sayEnroll('Asking your personal node…');
        enrollButton('Stop waiting');
        // Generated ONCE and reused, which now matters only for the
        // rate-limit retry. A fresh pair per attempt would work and would
        // mean the key this tab keeps is whichever one happened to be in
        // flight when an answer landed.
        devicePair().then(function (pair) {
          store(pair.pub, pair.priv, null);
          enrollRun(password, pair);
        }).catch(function (e) {
          enrollButton('Add this device');
          sayEnroll(e && e.message ? e.message : 'not now');
        });
      });

      // A 'Send to relay' box stood here until 2026-09-13. It posted to
      // /api/relay/send addressed to the reserved name `relay`, and the
      // relay console answered on the same response.
      //
      // The console is gone, and this box went with it rather than being
      // left to post into a 200-entry ring nobody can read back. It was
      // also the one thing a device could do that reached PAST its own
      // node to the relay, which the device architecture says it should
      // never have: a device's correspondent is the node that owns it.
      //
      // So an enrolled device now says who it is and nothing more. That
      // is honest about where the device arc actually is — see
      // design/relay/DEVICE.md, whose §7 is explicitly future layer.

    })();
  </script>
</body>
</html>
