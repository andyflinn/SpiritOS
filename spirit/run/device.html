<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SpiritOS — this device</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    form, #console { display: flex; flex-direction: column; gap: 0.75rem; }
    input, textarea { font: inherit; padding: 0.5rem; width: 100%; box-sizing: border-box; }
    button { font: inherit; padding: 0.5rem 0.75rem; width: fit-content; }
    #log { white-space: pre-wrap; min-height: 8rem; border: 1px solid #ccc; padding: 0.5rem; }
    /* Two lines while waiting: what is happening, and the fact that
       explains it. Neither is worth a second element. */
    #enroll-out { white-space: pre-line; }
    .hide { display: none !important; }
    /* Stated, not asked: it reads as the fact it is rather than a field
       somebody is meant to fill in. */
    input[readonly] { background: #f2f2f2; color: #555; border-style: dotted; }
  </style>
</head>
<body>
  <h1>This device</h1>

  <form id="enroll" autocomplete="on">
    <p>Adding a device for <strong id="who-for">this identity</strong> on
       <strong id="host">this relay</strong>.
       Works only while listening is on at that personal node.</p>
    <!--
      Restored after the cycle-5 drop replaced this page (df891bf).
      Chrome saves a lone password field unreliably and offers it back
      less reliably still — and remembering it IS how the password gets
      to the other device, copied once and synced, never typed.

      Was a constant, and is now THE PUBLIC LABEL of whoever this page is
      for — filled in below from /api/relay/who once the key in the
      address resolves. The constant was right while the page named
      nobody: the host adds nothing a saved entry does not already know,
      because browsers key by origin. But a relay carries many
      identities on ONE origin, so the origin cannot separate them and
      the username is the only field that can. That is the picker
      problem Andy actually had — "difficult to select from 13
      usernames" — and it is the reason PEER-DEVICES.md section 5 asks
      for the label here.

      Hidden in the accessibility sense, not display:none — the field is
      present and readable, stated rather than asked.
    -->
    <label>Account
      <input id="user" type="text" name="username" autocomplete="username"
             value="spirit-device" readonly tabindex="-1">
    </label>
    <label>Password
      <input id="pw" type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Add this device</button>
    <p id="enroll-out"></p>
  </form>

  <div id="console" class="hide">
    <p id="who"></p>
    <textarea id="line" rows="3" placeholder="help"></textarea>
    <button type="button" id="go">Send to relay</button>
    <div id="log"></div>
  </div>

  <script>
    (function () {
      var enroll = document.getElementById('enroll');
      var enrollOut = document.getElementById('enroll-out');
      var consoleEl = document.getElementById('console');
      var whoEl = document.getElementById('who');
      var lineEl = document.getElementById('line');
      var logEl = document.getElementById('log');

      // Whatever host actually served this page. Not baked in: the same
      // file is served by every relay its owner runs.
      document.getElementById('host').textContent = location.host;

      // WHOSE PAGE THIS IS, read off our own address. `/<key>/device`
      // carries the identity; the bare `/device` carries none and the
      // relay reads that as the owner, which is what it has always done.
      //
      // The segment is a base64url key (deviceAuth.keyToUrl). It is sent
      // back untouched — the relay is the one place that translates it,
      // so the page never has to know the stored form.
      //
      // A locator, not a credential: every key here is already public at
      // /api/relay/who, and holding one in the URL grants nothing. What
      // authorises is the password, and after that the signature.
      var enrollFor = (function () {
        var m = /^\/([A-Za-z0-9_-]{16,512})\/device\/?$/.exec(location.pathname);
        return m ? m[1] : '';
      })();

      // The key in the address is not something a person can read. The
      // LABEL is, and the relay publishes it — /api/relay/who hands the
      // whole census to anyone, so this costs no signature and reveals
      // nothing that was not already public.
      //
      // It lands in two places: the sentence at the top, so you can see
      // whose enrolment this is before typing a password into it, and
      // the username field, so the browser's password manager can tell
      // this account from the others on the same origin.
      function segOf(key) {
        return String(key == null ? '' : key)
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      if (enrollFor) {
        fetch('/api/relay/who')
          .then(function (r) { return r.json(); })
          .then(function (body) {
            var list = (body && body.peers) || [];
            var row = null;
            for (var i = 0; i < list.length; i++) {
              if (list[i] && segOf(list[i].publicKey) === enrollFor) { row = list[i]; break; }
            }
            if (!row) return;
            var label = row.publicLabel || row.name || '';
            if (!label) return;
            document.getElementById('who-for').textContent = label;
            document.getElementById('user').value = label;
          })
          .catch(function () { /* the sentence stays generic */ });
      }

      function sayEnroll(t) { enrollOut.textContent = t; }
      function sayLog(t) {
        logEl.textContent = (logEl.textContent ? logEl.textContent + '\n' : '') + t;
      }

      function b64(buf) {
        var u = new Uint8Array(buf);
        var s = '';
        for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
        return btoa(s);
      }

      function fromB64(s) {
        var bin = atob(s);
        var u = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        return u.buffer;
      }

      function store(pub, priv, name) {
        try {
          sessionStorage.setItem('spirit-device-public', pub);
          sessionStorage.setItem('spirit-device-private', priv);
          if (name) sessionStorage.setItem('spirit-device-name', name);
        } catch (e) {}
      }

      function loadStore() {
        try {
          return {
            pub: sessionStorage.getItem('spirit-device-public'),
            priv: sessionStorage.getItem('spirit-device-private'),
            name: sessionStorage.getItem('spirit-device-name')
          };
        } catch (e) {
          return {};
        }
      }

      function showConsole(name) {
        enroll.classList.add('hide');
        consoleEl.classList.remove('hide');
        whoEl.textContent = name ? ('signed in as ' + name) : 'signed in';
      }

      async function devicePair() {
        if (!crypto.subtle || typeof crypto.subtle.generateKey !== 'function') {
          throw new Error('this browser cannot sign');
        }
        var pair = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
        var spki = await crypto.subtle.exportKey('spki', pair.publicKey);
        var pkcs8 = await crypto.subtle.exportKey('pkcs8', pair.privateKey);
        return { pub: b64(spki), priv: b64(pkcs8) };
      }

      async function signLine(privB64, message) {
        var key = await crypto.subtle.importKey(
          'pkcs8',
          fromB64(privB64),
          { name: 'Ed25519' },
          false,
          ['sign']
        );
        var bytes = new TextEncoder().encode(message);
        var sig = await crypto.subtle.sign({ name: 'Ed25519' }, key, bytes);
        return b64(sig);
      }

      function sendMessage(from, to, text) {
        return 'send\n' + from + '\n' + to + '\n' + text;
      }

      // ---- Enrolment is a rendezvous, and the hold is what settles it ----
      //
      // The relay holds one offer for 66s (deviceHandshake.js) while a
      // listening node looks every 60s (hub.js DEVICE_TICK_MS). Nothing
      // synchronises those two clocks, so the guarantee has to come from
      // the arithmetic: an offer still open when the node looks cannot be
      // missed, whatever moment the button was pressed.
      //
      // It used to be 25s against 60s, and then it was a coin toss on the
      // phase — press just before a pass and it worked, press just after
      // and the hold expired 35s before anything came to collect it. Andy
      // found it exactly that way, reliable in both directions, which is
      // the tell.
      //
      // So this page knocking again is COVER, not the guarantee: a
      // minute-long request is the kind a hotel portal or a phone
      // changing masts will cut. Serially, never in parallel — the relay
      // has ONE pending slot, and a second offer while one is held is
      // refused at once, so overlapping attempts would lock out everyone
      // including ourselves.
      var ENROLL_BUDGET_MS = 180000;
      // Cover, not the guarantee. The guarantee is that the relay holds
      // one offer longer than one node pass (deviceHandshake.js), so a
      // single attempt cannot miss whatever moment the button was
      // pressed. This budget is for the case that breaks it: a network
      // that cuts a minute-long request — a hotel portal, a phone
      // changing masts — where knocking again is the only way through.
      // Two passes and change, so a cut connection gets more than one
      // more chance.

      // PROSE, NOT A CONSTANT. Nothing on this page computes with it —
      // it is here to be said out loud, because a wait nobody can see the
      // shape of is what made enrolment feel like a coin toss.
      //
      // It cannot be anything more: the page is served by the RELAY, and
      // the period belongs to a personal node the relay never reads. The
      // real coupling is elsewhere and it is arithmetic — the relay's
      // hold must exceed the node's pass (deviceHandshake.js), checked in
      // spirit/test/deviceRendezvous.js. This sentence is held to the
      // same number by that file so it cannot quietly go stale, but if
      // the two ever disagree it is the SENTENCE that is wrong.
      //
      // Grok, reviewing: "kill the third copy or mark it as prose."
      var ENROLL_PERIOD_HINT_MS = 60000;

      var ENROLL_ANSWERED_MS = 20000;
      // Under the hold, so the two silences can be told apart by the
      // clock alone. A refusal that comes back in three seconds means
      // something was there and said no; one that takes the full hold
      // means nobody came. The relay says "not now" to both on purpose
      // — it cannot tell a wrong password from an absent node, and will
      // not guess — but the browser knows how long it waited.

      // 429 means the relay has taken too many attempts for this name in
      // the last minute. That is the ONE refusal it names precisely —
      // everything else it answers `not now` to, on purpose — and it is
      // temporary, so it is a reason to wait rather than to stop. Twenty
      // seconds because the bucket is a rolling minute: a third of it is
      // usually enough for a slot to fall out.
      var ENROLL_RATE_WAIT_MS = 20000;

      var enrollStop = null;

      function enrollClock(ms) {
        var s = Math.max(0, Math.round(ms / 1000));
        return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
      }

      function enrollButton(label) {
        var b = enroll.querySelector('button[type="submit"]');
        if (b) b.textContent = label;
      }

      function enrollRun(password, pair) {
        var began = Date.now();
        var attempt = 0;
        var cancelled = false;
        var holdOffUntil = 0;

        // A page that says "waiting…" for two minutes is indistinguishable
        // from a page that has died. So: which attempt, how long it has
        // been, how long is left before it gives up, and the one fact
        // that explains all three — the node looks on its own clock,
        // about once a minute, and this page waits out several of those.
        //
        // Counting DOWN as well as up is the half that matters: elapsed
        // time alone still leaves somebody guessing whether to keep
        // watching.
        function paint() {
          var gone = Date.now() - began;
          var left = Math.max(0, ENROLL_BUDGET_MS - gone);
          var head = 'attempt ' + attempt + ', ' + enrollClock(gone) + ' gone, giving up in ' +
            enrollClock(left) + '.';

          // Holding off is a different wait and has to read as one, or the
          // counter says "waiting for your node" while the relay is the
          // thing that has not let us through yet.
          if (holdOffUntil > Date.now()) {
            sayEnroll('This relay has taken too many enrolment attempts for this name in the ' +
              'last minute — ' + head + '\n' +
              'Knocking again in ' + Math.ceil((holdOffUntil - Date.now()) / 1000) +
              's. Nothing is wrong and nothing needs re-typing.');
            return;
          }

          sayEnroll('Waiting for your personal node — ' + head + '\n' +
            'It looks about once every ' + Math.round(ENROLL_PERIOD_HINT_MS / 1000) +
            's, and the relay holds this request open past one of those — so it ' +
            'should finish inside a minute, whenever you pressed the button.');
        }
        var ticker = setInterval(paint, 1000);
        var holdOff = null;

        function finish(text) {
          clearInterval(ticker);
          if (holdOff) { clearTimeout(holdOff); holdOff = null; }
          enrollStop = null;
          enrollButton('Add this device');
          sayEnroll(text);
        }

        enrollStop = function () {
          cancelled = true;
          finish('Stopped after ' + enrollClock(Date.now() - began) + '. Nothing was changed.');
        };

        function attemptOnce() {
          if (cancelled) return;
          attempt += 1;
          paint();
          var sent = Date.now();
          fetch('/api/relay/device', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: enrollFor,
              password: password,
              devicePublicKey: pair.pub
            })
          }).then(function (res) {
            return res.text().then(function (t) { return { res: res, text: t }; });
          }).then(function (r) {
            if (cancelled) return;
            var body = r.text;
            try { body = JSON.parse(r.text); } catch (e) {}

            if (r.res.ok && body && body.ok) {
              var name = body.name || '';
              clearInterval(ticker);
              enrollStop = null;
              enrollButton('Add this device');
              store(pair.pub, pair.priv, name);
              showConsole(name);
              sayEnroll('Added after ' + enrollClock(Date.now() - began) +
                ', on attempt ' + attempt + '.');
              sayLog('this tab is the device');
              return;
            }

            var took = Date.now() - sent;

            // The one refusal the relay names precisely, and it is not a
            // stop. Waiting it out is what a person would do anyway, and
            // the password is already typed.
            if (r.res.status === 429) {
              if (Date.now() - began >= ENROLL_BUDGET_MS) {
                finish('Gave up after ' + enrollClock(Date.now() - began) + '. This relay kept ' +
                  'refusing on rate — too many enrolment attempts for this name in the last ' +
                  'minute. Leave it a minute and press the button again.');
                return;
              }
              holdOffUntil = Date.now() + ENROLL_RATE_WAIT_MS;
              paint();
              holdOff = setTimeout(function () {
                holdOff = null;
                holdOffUntil = 0;
                attemptOnce();
              }, ENROLL_RATE_WAIT_MS);
              return;
            }

            if (took < ENROLL_ANSWERED_MS) {
              // Refused at once rather than nobody coming. The relay says
              // `not now` to every cause on purpose — it faces the
              // internet and owes it no detail — so this lists them, and
              // the ORDER matters: the first draft led with "the password
              // is wrong", which is the one cause that leaves a trace
              // somewhere else, and it is usually not the one.
              //
              // The last line is the actual diagnosis, and it costs
              // nothing: the node reports what it saw. `a wrong password
              // was refused` means the password reached it. Anything else
              // means it never did, and then it is this relay holding a
              // slot or counting attempts, not the password.
              finish('Refused in ' + Math.round(took / 1000) + 's — something answered straight ' +
                'away rather than nobody coming. Most likely another attempt of yours is still ' +
                'running: this page keeps knocking for three minutes, and one held slot per ' +
                'name means a second tab is refused at once. Close any other copy of this page ' +
                'and press the button again — the password is still filled in.\n' +
                'If there is no other tab, the password is wrong. Your personal node\'s panel ' +
                'in Natter says which: "a wrong password was refused" means it arrived and was ' +
                'read; anything else means it never got there.');
              return;
            }

            if (Date.now() - began >= ENROLL_BUDGET_MS) {
              finish('Gave up after ' + enrollClock(Date.now() - began) + ' and ' + attempt +
                ' attempts. Nothing came to collect it, so the personal node is not listening ' +
                '— or it is bound to a different relay than this one.');
              return;
            }
            attemptOnce();
          }).catch(function (e) {
            finish('Network error after ' + enrollClock(Date.now() - began) + ': ' +
              (e && e.message ? e.message : 'the request failed') + '.');
          });
        }

        attemptOnce();
      }

      enroll.addEventListener('submit', function (ev) {
        ev.preventDefault();
        // One button, two meanings, and the label says which — the same
        // reasoning as Natter's panel. A three-minute wait with no way
        // out would be worse than the coin toss it replaces.
        if (enrollStop) {
          enrollStop();
          return;
        }
        var password = document.getElementById('pw').value;
        sayEnroll('Waiting for your personal node…');
        enrollButton('Stop waiting');
        // Generated ONCE and reused for every attempt. A fresh pair per
        // attempt would work, but it would mean the key this tab keeps is
        // whichever one happened to be in flight when a pass landed.
        devicePair().then(function (pair) {
          store(pair.pub, pair.priv, null);
          enrollRun(password, pair);
        }).catch(function (e) {
          enrollButton('Add this device');
          sayEnroll(e && e.message ? e.message : 'not now');
        });
      });

      document.getElementById('go').addEventListener('click', function () {
        var st = loadStore();
        var text = lineEl.value || '';
        if (!st.priv || !st.name) {
          sayLog('not now');
          return;
        }
        if (!text.trim()) return;
        var msg = sendMessage(st.name, 'relay', text);
        signLine(st.priv, msg).then(function (sig) {
          return fetch('/api/relay/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: st.name,
              to: 'relay',
              text: text,
              sig: sig
            })
          });
        }).then(function (res) {
          return res.text().then(function (t) {
            var body = t;
            try { body = JSON.parse(t); } catch (e) {}
            if (res.ok && body && body.consoleReply && body.consoleReply.text) {
              sayLog('> ' + text + '\n' + body.consoleReply.text);
            } else if (res.ok) {
              sayLog('> ' + text);
            } else {
              sayLog((body && body.error) || 'not now');
            }
            lineEl.value = '';
          });
        }).catch(function (e) {
          sayLog(e && e.message ? e.message : 'not now');
        });
      });
    })();
  </script>
</body>
</html>
