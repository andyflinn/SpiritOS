<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpiritOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/spirit/kernel.js"></script>
    <!-- The spirit object (goal/G32.1): the node api, async and checked; its families start at once at home. -->
    <script src="/spirit.js"></script>
    <script>if (window.spirit && typeof window.spirit.start === 'function' && !window.spirit.transport) window.spirit.start();</script>
    <!-- The isomorphic half of spirit/ownerBadge.js: the relay rules the
         browser has to obey too (the relay panel's Remove asks it whether
         this node may be left with fewer relays). Node-only code inside it
         never runs here. -->
    <script src="/spirit/ownerBadge.js"></script>
    <!-- The isomorphic half of spirit/fieldRules.js: what a label may be.

         Andy: "an input field should validate before taxing the wire."

         The relay is still the enforcer — it writes the ledger and checks
         every claim and rename regardless. This is so a form can say what
         is wrong while the cursor is still in the box, instead of paying
         a round trip to another continent to be told about a space. One
         file so the two cannot drift. -->
    <script src="/spirit/fieldRules.js"></script>
    <!-- The probability modules, the servers' own search code, in the shell
         (goal/G27.14). Andy: "why down't the UI run the exact same search
         code in the shell?", and "ideally we make it super-easy to implement
         it, right inside of contact-list elements etc,, and they all can
         count on the probability stuff being available, shell-side....".
         Found on window.spirit.probability: probabilityStringMatch,
         probabilityStringObjectMatch (which needs the first, so it loads
         after it) and createProbabilityBucket. -->
    <script src="/spirit/probabilityStringMatch.js"></script>
    <script src="/spirit/probabilityStringObjectMatch.js"></script>
    <script src="/spirit/probabilityBucket.js"></script>
    <!-- The isomorphic half of spirit/lever.js: what a lever is, what it may
         be set to, and how it describes itself.

         Here for the same reason as fieldRules: the Relay Monitor checks a
         value against the lever's own floor and ceiling before taxing the
         wire, using the SAME canSet the relay will apply. The relay is
         still the enforcer — it refuses whatever a browser believed.

         `fromReport` deliberately has no `set`: nothing on the node may
         move a relay's value except by asking the relay. -->
    <script src="/spirit/lever.js"></script>
    <!-- One peer, one file, named by the peer's whole public key. Stays up
         in spirit/ because hub.js names files with it too. -->
    <script src="/spirit/peerFile.js"></script>
    <!-- limits.js first: packet.js reads PAYLOAD_MAX off window.spirit.limits,
         so the size a page refuses is the size the relay refuses. -->
    <script src="/spirit/limits.js"></script>
    <!-- The envelope every app's traffic travels in, inside the relay's
         own `text` field.

         NOT isomorphic any more, and that is the point. This said "the hub
         wraps with it in node, the apps read it here" — and the hub doing
         the wrapping was the node knowing what an app is (Andy: "nothing
         in node and relay should know about apps"). The node requires it
         only to carry envelopes: arrivals.js decodes every arrival with it,
         hub.js and server.js encode with it, and none routes on `app`.

         It lives in spirit/client/, with the only layer that routes on
         `app`: the shell composes an envelope on the way out and reads one
         on the way in, and the node carries the payload between them. -->
    <script src="/spirit/client/packet.js"></script>
    <!-- The owner's api tree read for choosing (apiAuth/G1.8): the names
         of the servers in the 'api' answer on /api/spirit, a failed branch left
         out. What the appServer selector chooses from. -->
    <script src="/spirit/client/apiTreeIndex.js"></script>
    <!-- The shell's look is one sheet, shell.css, which the face loads too (goal/G30.9). -->
    <link rel="stylesheet" href="/shell.css" />
  </head>
  <body>
    <div id="desktop"></div>

    <div id="app-container" hidden>
      <div id="app-header">
        <button id="app-close" type="button" title="Back">⬅️</button>
        <button id="app-home" type="button" title="Home">🏠</button>
        <div id="app-title"></div>
        <span id="app-offline" title="This page cannot hear its node right now; it reconnects by itself" hidden>not connected</span>
        <button id="app-dialog-close" type="button" title="Close" style="display:none">✖</button>
      </div>
      <div id="app-content"></div>
    </div>

    <!-- The element factories apps build their screens from, one file per
         element (goal/G2.14). Each adds itself to window.spirit.element (or
         window.spirit.elements, for those not yet moved, goal/G43.5); the
         shell hands some of them to apps as api.ui.elements. Before the shell, and
         the app-server selector before the api-branch one built from it. -->
    <script src="/spirit/element/search/icon.js"></script>
    <script src="/spirit/element/appHeader/appHeader.js"></script>
    <script src="/spirit/element/contactLabel.js"></script>
    <script src="/spirit/element/joinForm.js"></script>
    <script src="/spirit/element/faceForm.js"></script>
    <script src="/spirit/element/joinSteps.js"></script>
    <!-- The shared progress bar (goal/G29.14), handed to apps as api.ui.element.progressBar. -->
    <script src="/spirit/element/progressBar.js"></script>
    <script src="/spirit/element/search/contact.js"></script>
    <script src="/spirit/element/search/api.js"></script>
    <script src="/spirit/element/search/api.js"></script>
    <!-- The faceless layer (goal/G30.16): one data tree mirroring the node, before every element that reads it; the
         shared row base and the standard list-tool (goal/G30.17, G30.18). -->
    <script src="/spirit/data.js"></script>
    <script src="/spirit/element/rowElement.js"></script>
    <script src="/spirit/element/search.js"></script>
    <!-- The viewers (goal/G30.16): the frame both share, fstat since goal/G43.17, then text, and media from its new app (old may
         require new, never the reverse).
         DISCREPANCY WITH ANDY's RULES: spirit/element/textViewer.js was deleted in Andy's commit faaf2b1b ("kill!"); this
         page still asks for it (a 404), and the Text File Launcher below still calls spirit.element.textViewer, which
         throws when a text file is opened. -->
    <script src="/spirit/element/fstat.js"></script>
    <script src="/spirit/element/textViewer.js"></script>
    <script src="/spirit/app/media/media.js"></script>
    <!-- One folder per object type (goal/G30.20): its row, which takes its type's stream (goal/G41.16), and its drop-in list. -->
    <script src="/spirit/element/search/file/rowElement.js"></script>
    <script src="/spirit/element/search/file.js"></script>
    <script src="/spirit/element/search/contact/rowElement.js"></script>
    <script src="/spirit/element/search/contact/listElement.js"></script>
    <!-- Icons (goal/G30.21): a row and a list, no translator: the set is one file. -->
    <script src="/spirit/element/search/icon/rowElement.js"></script>
    <script src="/spirit/element/search/icon/listElement.js"></script>
    <!-- An input stops at its field rule's limit as it is typed (goal/G32.2). -->
    <script src="/spirit/element/fieldInput.js"></script>
    <script src="/spirit/client/shell.js"></script>
    <script>
      (function () {
        var ICON = spirit.core.const.ICON;
        var registerApp = spirit.shell.registerApp;
        var launchApp = spirit.shell.launchApp;
        var escapeHtml = spirit.shell.escapeHtml;
        var setViewerTitle = spirit.shell.setViewerTitle;
        var renderAppGroup = spirit.shell.renderAppGroup;
        var listApps = spirit.shell.listApps;
        var getAppOverride = spirit.shell.getAppOverride;
        var setAppOverride = spirit.shell.setAppOverride;
        var fileInfoRow = spirit.shell.fileInfoRow;
        var listGroups = spirit.shell.listGroups;
        var createGroup = spirit.shell.createGroup;
        var updateGroup = spirit.shell.updateGroup;
        var deleteGroup = spirit.shell.deleteGroup;

        // ---- Files app ---- STOOD HERE: Files moved to spirit/app/file/
        // (goal/G43.17) and the old shell has none; the two launchers
        // below stay here.

        // ---- The two launchers: the viewer elements (goal/G30.16) ----
        // The viewers are elements now (spirit/element/fstat.js and the media app's spirit/app/media/media.js, goal/G43.17;
        // the text viewer, spirit/element/textViewer.js, is deleted, see the DISCREPANCY note above), so the face has them too; their inline bodies and the job form stood here. Only reachable via
        // launchApp(id, { path }) from Open with or a file row — no desktop icon (hidden: true). A launcher, not a dialog: every one of
        // its launches replaces its own stack entry (assertOneHiddenApp, shell.js). mount runs once; loadFile shows each
        // later file.
        var mediaShown = null;
        registerApp({
          id: 'text-file-launcher',
          name: 'Text File Launcher',
          icon: ICON.CODE,
          hidden: true,
          type: 'launcher',
          mount: function (container, api, params) {
            this._host = container;
            this.loadFile(params.path, params);
          },
          loadFile: function (path, params) {
            setViewerTitle(path);
            window.spirit.element.textViewer.create(this._host, { path: path, words: params && params.words, line: params && params.line });
          },
          render: function () {},
        });
        registerApp({
          id: 'media-launcher',
          name: 'Media Launcher',
          icon: ICON.VIEW,
          hidden: true,
          type: 'launcher',
          mount: function (container, api, params) {
            this._host = container;
            this.loadFile(params.path, params);
          },
          loadFile: function (path) {
            setViewerTitle(path);
            if (mediaShown) mediaShown.destroy();
            mediaShown = window.spirit.elements.media.create(this._host, { path: path });
          },
          render: function () {},
        });

        // ---- Spirit app (launcher/grouping template) ----
        // Hosts a sub-view of the machine-introspection apps — hidden from
        // the real desktop — using the same reusable icon-grid template
        // user-created groups also build on (registerGroupApp, shell.js).
        // Of its fixed members only shell/jobs still exists (Stats and Apps
        // were deleted); renderAppGroup skips an id with no app.
        registerApp({
          id: 'spirit',
          name: 'Spirit',
          icon: ICON.SPIRIT,
          mount: function (container, api, params) {
            container.innerHTML = '<div class="app-group-grid" id="spirit-group"></div>';
          },
          render: function () {
            var grid = document.getElementById('spirit-group');
            if (!grid) return;
            // The fixed built-in members, plus every intrinsic app the
            // shell discovered. Intrinsic apps are part of
            // how the node works rather than something installed, so this
            // is their launcher home and the only one — the Location
            // picker cannot move them out (setAppOverride, shell.js).
            //
            // The two halves may overlap; renderAppGroup
            // draws one tile per id, so this list does not have to know
            // what is already in it.
            renderAppGroup(grid, ['shell/stats', 'shell/jobs', 'shell/apps']
              .concat(spirit.shell.listIntrinsicApps()));
          },
        });

      })();
    </script>
  </body>
</html>
