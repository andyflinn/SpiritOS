<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shell.css">
<style>body { margin: 0; }</style>
</head>
<body>
<script src="/spirit.js"></script>
<script>
// goal/G41.27 (Andy, box: "new shell element: rowForm", "one row forms show as blocks taking up the full width of their
// container, and wrap, if it's form elements don't have enough space.", "they form a bubble with transparent
// background, and a border with the color of the type-face.", "the first element is always an icon shell-element, and
// takes the (top-) left position", "the last element is always a button that is positioned at the (bottom-) right",
// "between the icon and the button is a span, into which the form elements can be dropped."): rowForms in containers of
// stated widths, and a probabilitySearch beside them, and what the browser makes of them, measured. Opened by
// ./rowForm.js at /DEBUG/spirit/element/test/rowForm-laid.html.
window.laid = function () {
  return Promise.all([spirit.require('spirit/element/rowForm.js').catch(function () { return null; }), spirit.require('spirit/element/search.js').catch(function () { return null; })]).then(function () {
    var R = (spirit.element || {}).rowForm;
    var out = { made: !!R && typeof R.create === 'function' };
    if (!out.made) return JSON.stringify(out);
    function rect(el) { if (!el) return null; var r = el.getBoundingClientRect(); return { top: Math.round(r.top * 10) / 10, bottom: Math.round(r.bottom * 10) / 10, left: Math.round(r.left * 10) / 10, right: Math.round(r.right * 10) / 10, h: Math.round(r.height * 10) / 10 }; }
    function inner(el) { var r = el.getBoundingClientRect(); var s = getComputedStyle(el);
      return { top: r.top + parseFloat(s.borderTopWidth) + parseFloat(s.paddingTop), bottom: r.bottom - parseFloat(s.borderBottomWidth) - parseFloat(s.paddingBottom),
        left: r.left + parseFloat(s.borderLeftWidth) + parseFloat(s.paddingLeft), right: r.right - parseFloat(s.borderRightWidth) - parseFloat(s.paddingRight) }; }
    // One form in a container of a width, its span given inputs of a width each.
    function form(width, inputs, inputWidth) {
      var c = document.createElement('div');
      c.style.cssText = 'width:' + width + 'px;margin:10px';
      document.body.appendChild(c);
      var f = R.create(c, { icon: '🧾', button: 'Grant' });
      var m = { answered: !!f && !!f.root && !!f.span && !!f.button, appended: !!f && !!f.root && c.contains(f.root) };
      if (!m.answered) return m;
      for (var i = 0; i < inputs; i++) { var x = document.createElement('input'); x.type = 'text'; x.style.width = inputWidth + 'px'; f.span.appendChild(x); }
      var s = getComputedStyle(f.root);
      var kids = Array.prototype.slice.call(f.root.children);
      var icon = kids[0] || null;
      m.container = rect(c); m.root = rect(f.root); m.inner = inner(f.root);
      m.background = s.backgroundColor; m.color = s.color; m.radius = s.borderTopLeftRadius;
      m.border = [s.borderTopColor, s.borderRightColor, s.borderBottomColor, s.borderLeftColor];
      m.borderWidth = [s.borderTopWidth, s.borderRightWidth, s.borderBottomWidth, s.borderLeftWidth];
      m.rootClass = String(f.root.className || '');
      m.iconClass = icon ? String(icon.className || '') : ''; m.iconText = icon ? icon.textContent : '';
      m.icon = rect(icon);
      m.last = kids.length ? (kids[kids.length - 1] === f.button) : false;
      m.buttonTag = f.button.tagName; m.buttonText = f.button.textContent.trim(); m.button = rect(f.button);
      m.spanInRoot = f.root.contains(f.span);
      m.order = !!icon && (icon.compareDocumentPosition(f.span) & 4) !== 0 && (f.span.compareDocumentPosition(f.button) & 4) !== 0;
      var ins = Array.prototype.slice.call(f.span.querySelectorAll('input'));
      m.inputs = ins.map(rect);
      // A press is the mounter's to wire: the form itself sends nothing and changes nothing.
      var before = f.root.outerHTML; f.button.click(); m.pressQuiet = f.root.outerHTML === before;
      return m;
    }
    out.one = form(600, 2, 80);
    out.wrapped = form(260, 4, 120);
    // probabilitySearch's bubble beside it: the one shared style (box: "The bubble is one shared style, the same
    // probabilitySearch's search bubble uses.").
    var P = (spirit.element || {}).search;
    if (P) {
      var pc = document.createElement('div'); pc.style.cssText = 'width:400px;height:200px;display:flex;flex-direction:column';
      document.body.appendChild(pc);
      P.create(pc, { columns: [{ field: 'name' }], rows: function () { return [{ key: 'a', name: 'a' }]; } });
      var text = pc.querySelector('input[type="text"]');
      // The search's bubble: the nearest box around its search input that draws a border.
      var b = text ? text.parentElement : null;
      while (b && b !== pc) { var st = getComputedStyle(b); if (parseFloat(st.borderTopWidth) > 0 && st.borderTopStyle !== 'none') break; b = b.parentElement; }
      out.searchBubbleClass = b && b !== pc ? String(b.className || '') : '';
    }
    return JSON.stringify(out);
  });
};
</script>
</body>
</html>
