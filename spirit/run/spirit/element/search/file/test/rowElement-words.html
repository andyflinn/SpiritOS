<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<div id="rows"></div>
<script src="/spirit.js"></script>
<script>
// goal/G43.4 (Andy: a path element coloured "if their names match a reserved word AND the browsers spirit object contains the
// corresponding javascript Object at that path.", another "if folders and the browser spirit object disagree.", "the colors
// will follow word.json changes live."; the colours are goal/G43.18's, below): real file rows on a scratch node, and the
// colour of each path element as the browser computes it. Opened by ./rowElement.js at
// /DEBUG/spirit/element/search/file/test/rowElement-words.html.
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var made = {};
function colourOf(el) {
  var m = /rgba?\((\d+), (\d+), (\d+)/.exec(getComputedStyle(el).color);
  if (!m) return 'none';
  var r = +m[1], g = +m[2], b = +m[3];
  // goal/G43.18, Andy: "file app: please change the green colored paths/files in light blue instead.": light blue is a bright blue with red and green
  // in it, as lightskyblue or lightblue; green stays named, so a row still green is seen.
  // Q30, Andy: "yes!" to "light purple, with no colour change for what the spirit object holds and no red left": light purple
  // is red and blue well above green, as plum or a lavender; the colours before it stay named, so a row still in one is seen.
  if (r >= 170 && b >= 170 && r - g >= 30 && b - g >= 30) return 'lightpurple';
  return b >= 200 && g >= 150 && r >= 100 && b - r >= 30 ? 'lightblue' : g >= 180 && r <= 120 && b <= 120 ? 'green' : r >= 200 && g <= 90 && b <= 90 ? 'red' : 'none';
}
// Each path element of a row: the innermost element whose text is that element, its slash aside.
function read(host, parts) {
  var out = {};
  var leaves = Array.prototype.filter.call(host.querySelectorAll('*'), function (e) { return !e.children.length; });
  parts.forEach(function (part) {
    var hit = leaves.filter(function (e) { return e.textContent.replace(/\//g, '').trim() === part; })[0];
    out[part] = hit ? colourOf(hit) : 'no element';
  });
  return out;
}
window.ready = function () {
  return Promise.resolve(spirit.start()).then(function () { return spirit.require('spirit/element/search/file/rowElement.js'); }).then(function () { return wait(800); }).then(function () { return 'ready'; });
};
window.row = function (p, kind) {
  var host = made[p];
  if (!host) {
    host = made[p] = document.getElementById('rows').appendChild(document.createElement('div'));
    window.spirit.element.spirit.element.search.file.rowElement.create({ path: p, kind: kind || 'folder' }).mount({ name: host });
  }
  return wait(1500).then(function () { return JSON.stringify(read(host, p.split('/'))); });
};
window.setObject = function (on) { if (on) window.spirit.app.thing = {}; else delete window.spirit.app.thing; };
window.fresh = function (p) { var h = made[p]; if (h) { h.remove(); delete made[p]; } };
</script>
</body>
</html>
