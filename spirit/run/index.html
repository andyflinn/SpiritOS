<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpiritOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- CodeMirror 5, the shell's local copy (goal/G29.12): its own look, then the dark theme the text view uses. -->
    <link rel="stylesheet" href="/shell/node_modules/codemirror/lib/codemirror.css" />
    <link rel="stylesheet" href="/shell/node_modules/codemirror/theme/material-darker.css" />
    <link rel="stylesheet" href="/shell/node_modules/codemirror/addon/dialog/dialog.css" />
    <script src="/js/kernel.js"></script>
    <!-- The isomorphic half of js/ownerBadge.js: the relay rules the
         browser has to obey too (Natter's Remove asks it whether this
         node may be left with fewer relays). Node-only code inside it
         never runs here. -->
    <script src="/js/ownerBadge.js"></script>
    <!-- The isomorphic half of js/fieldRules.js: what a label may be.

         Andy: "an input field should validate before taxing the wire."

         The relay is still the enforcer — it writes the ledger and checks
         every claim and rename regardless. This is so a form can say what
         is wrong while the cursor is still in the box, instead of paying
         a round trip to another continent to be told about a space. One
         file so the two cannot drift. -->
    <script src="/js/fieldRules.js"></script>
    <!-- The probability modules, the servers' own search code, in the shell
         (goal/G27.14). Andy: "why down't the UI run the exact same search
         code in the shell?", and "ideally we make it super-easy to implement
         it, right inside of contact-list elements etc,, and they all can
         count on the probability stuff being available, shell-side....".
         Found on window.spiritProbability: probabilityStringMatch,
         probabilityStringObjectMatch (which needs the first, so it loads
         after it) and createProbabilityBucket. -->
    <script src="/js/probabilityStringMatch.js"></script>
    <script src="/js/probabilityStringObjectMatch.js"></script>
    <script src="/js/probabilityBucket.js"></script>
    <!-- The isomorphic half of js/lever.js: what a lever is, what it may
         be set to, and how it describes itself.

         Here for the same reason as fieldRules: the Relay Monitor checks a
         value against the lever's own floor and ceiling before taxing the
         wire, using the SAME canSet the relay will apply. The relay is
         still the enforcer — it refuses whatever a browser believed.

         `fromReport` deliberately has no `set`: nothing on the node may
         move a relay's value except by asking the relay. -->
    <script src="/js/lever.js"></script>
    <!-- One peer, one file, named by the peer's whole public key. Stays up
         in js/ because hub.js and peerStats.js name files with it too.
         js/client/chatLog.js reads it at load, so it comes first. -->
    <script src="/js/peerFile.js"></script>
    <!-- How a conversation is filed on this node. Relay Chat holds the
         files through its own scoped api.fs; this only decides names,
         shapes and merging.

         Browser-only, so js/client/. It exports to node as well, but no
         node module requires it — that half is there so the merging can be
         asserted in a test instead of only looked at, which is not the
         same thing as being isomorphic.

         Relay Chat was its only reader, and Andy: "chatLog.js actually
         belongs in run/shell/relayChat/". THAT HAPPENED ON 2026-09-25 —
         the app left for its own repo and chatLog.js went with it, which
         is the same judgement carried to its end rather than a new one.

         THIS CORRECTS THE NOTE THAT STOOD HERE, which said it sits on loan
         and goes when Relay Chat goes. Relay Chat is not going — it is
         parked because it grows into a conversational surface over shell
         functions ("/contact gets a dropdown showing contact labels", same
         for invites and files). Andy: "the modularization of chat might be
         via elements it borrows from shell or generic, client packets."

         Under that, this file is not homeless and not on loan. It is a
         DECIDING module with no painting — names, shapes, merging, driven
         from node by a test — which is the same shape as iconIndex.js and
         exactly what api.ui.elements' rule asks for (see shell.js, above
         createIconSelector). An app borrowing the shell's controls is the
         direction of travel, so a deciding module sitting beside the shell
         is the pattern rather than the exception.

         What is still true: no app owns a second file, because an app is
         one script. That is not what would need building. -->
    <script src="/js/client/chatLog.js"></script>
    <!-- limits.js first: packet.js reads PAYLOAD_MAX off window.spiritLimits,
         so the size a page refuses is the size the relay refuses. -->
    <script src="/js/limits.js"></script>
    <!-- The envelope every app's traffic travels in, inside the relay's
         own `text` field.

         NOT isomorphic any more, and that is the point. This said "the hub
         wraps with it in node, the apps read it here" — and the hub doing
         the wrapping was the node knowing what an app is (Andy: "nothing
         in node and relay should know about apps"). No module under
         run/js requires this file now, and the packet suite fails if one
         does again.

         So it lives in js/client/ now, with the only layer that routes on
         `app`: the shell composes an envelope on the way out and reads one
         on the way in, and the node carries an opaque payload between
         them. The directory is the statement — a file in js/ is one a
         relay may end up loading. -->
    <script src="/js/client/packet.js"></script>
    <!-- The ICON table read the other way round — one line per glyph,
         carrying every name it is keyed under. What the icon selector
         chooses from. Browser-only like chatLog.js above: the node export
         is so the grouping and the filtering can be asserted rather than
         only looked at, not because anything in the node reads it. -->
    <script src="/js/client/iconIndex.js"></script>
    <!-- The owner's api tree read for choosing (apiAuth/G1.8): the names
         of the servers in a jobs.api 'api' answer, a failed branch left
         out. What the appServer selector chooses from; same two-sided
         shape as iconIndex.js above. -->
    <script src="/js/client/apiTreeIndex.js"></script>
    <!-- The shell's look is one sheet, shell.css, which the face loads too (goal/G30.9). -->
    <link rel="stylesheet" href="/shell.css" />
  </head>
  <body>
    <div id="desktop"></div>

    <div id="app-container" hidden>
      <div id="app-header">
        <button id="app-close" type="button" title="Back">⬅️</button>
        <button id="app-home" type="button" title="Home">🏠</button>
        <div id="app-title"></div>
        <span id="app-offline" title="This page cannot hear its node right now; it reconnects by itself" hidden>not connected</span>
        <button id="app-dialog-close" type="button" title="Close" style="display:none">✖</button>
      </div>
      <div id="app-content"></div>
    </div>

    <!-- The element factories apps build their screens from, one file per
         element (goal/G2.14). Each adds itself to window.spiritElements; the
         shell hands them to apps as api.ui.elements. Before the shell, and
         the app-server selector before the api-branch one built from it. -->
    <!-- CodeMirror 5 and the modes the text view picks by extension, before the text view (goal/G29.12). -->
    <script src="/shell/node_modules/codemirror/lib/codemirror.js"></script>
    <!-- Search and replace, CodeMirror's own add-ons (goal/G29.12): Ctrl+F, Ctrl+G, Shift+Ctrl+F, Alt+G. -->
    <script src="/shell/node_modules/codemirror/addon/dialog/dialog.js"></script>
    <script src="/shell/node_modules/codemirror/addon/search/searchcursor.js"></script>
    <script src="/shell/node_modules/codemirror/addon/search/search.js"></script>
    <script src="/shell/node_modules/codemirror/addon/search/jump-to-line.js"></script>
    <script src="/shell/node_modules/codemirror/mode/javascript/javascript.js"></script>
    <script src="/shell/node_modules/codemirror/mode/css/css.js"></script>
    <script src="/shell/node_modules/codemirror/mode/xml/xml.js"></script>
    <script src="/shell/node_modules/codemirror/mode/htmlmixed/htmlmixed.js"></script>
    <script src="/shell/node_modules/codemirror/mode/markdown/markdown.js"></script>
    <script src="/shell/js/textView.js"></script>
    <script src="/shell/js/iconSelector.js"></script>
    <script src="/shell/js/appHeader/appHeader.js"></script>
    <script src="/shell/js/contactLabel.js"></script>
    <script src="/shell/js/joinForm.js"></script>
    <script src="/shell/js/peerFind.js"></script>
    <script src="/shell/js/faceForm.js"></script>
    <script src="/shell/js/joinSteps.js"></script>
    <!-- The shared list with its search (goal/G29.4), before the contact selector, its wrapper since goal/G29.6. -->
    <script src="/shell/shared/js/listSearch.js"></script>
    <!-- The shared progress bar (goal/G29.14), handed to apps as api.ui.elements.progressBar. -->
    <script src="/shell/shared/js/progressBar.js"></script>
    <script src="/shell/js/contactSelector.js"></script>
    <script src="/shell/js/fileSelector.js"></script>
    <script src="/shell/js/appServerSelector.js"></script>
    <script src="/shell/js/apiBranchSelector.js"></script>
    <!-- The rowElements (goal/G30.18): the shared base, then one file per kind. -->
    <script src="/shell/js/rowElement.js"></script>
    <script src="/shell/js/rows/fileElement.js"></script>
    <script src="/shell/js/rows/contactElement.js"></script>
    <script src="/js/client/shell.js"></script>
    <script>
      (function () {
        var ICON = spirit.core.const.ICON;
        var registerApp = spirit.shell.registerApp;
        var launchApp = spirit.shell.launchApp;
        var escapeHtml = spirit.shell.escapeHtml;
        var renderOpenWith = spirit.shell.renderOpenWith;
        var renderAppOfFile = spirit.shell.renderAppOfFile;
        var findJobByType = spirit.shell.findJobByType;
        var mimeTypeForName = spirit.shell.mimeTypeForName;
        var classifyMimeType = spirit.shell.classifyMimeType;
        var iconForFile = spirit.shell.iconForFile;
        var CATEGORY_APP_HANDLERS = spirit.shell.CATEGORY_APP_HANDLERS;
        var setViewerTitle = spirit.shell.setViewerTitle;
        var renderFileInfoBubble = spirit.shell.renderFileInfoBubble;
        var renderAnnotationsSection = spirit.shell.renderAnnotationsSection;
        var renderAppGroup = spirit.shell.renderAppGroup;
        var listApps = spirit.shell.listApps;
        var getAppOverride = spirit.shell.getAppOverride;
        var setAppOverride = spirit.shell.setAppOverride;
        var fileInfoRow = spirit.shell.fileInfoRow;
        var listGroups = spirit.shell.listGroups;
        var createGroup = spirit.shell.createGroup;
        var updateGroup = spirit.shell.updateGroup;
        var deleteGroup = spirit.shell.deleteGroup;

        // ---- Files app ----
        // Moved to app/files/files.js + files.json (CLEANUP-PLAN). It is
        // intrinsic now, so it is declared at boot from its manifest and
        // its tile lives in the Spirit group; the two launchers below
        // stay here, and Files opens them through api.launchApp.

        // ---- Text File Launcher app ----
        // Only reachable via launchApp('text-file-launcher', { path }) from Files or
        // the Processes app — no desktop icon (hidden: true).
        function maybeRenderJobForm(container, scriptPath) {
          var match = scriptPath.match(/^process\/([^/]+)\/([^/]+)\/(.+)\.js$/);
          if (!match) return;

          var lang = match[1]; // 'js' -> node, anything else used as the literal command name
          var manifestPath = scriptPath.replace(/\.js$/, '.json');
          var manifestRaw = spirit.core.fs.loadFile(manifestPath);
          if (manifestRaw == null) return; // no manifest, no form — just a plain code view

          var manifest;
          try {
            manifest = JSON.parse(manifestRaw); // { label, description?, args: [{name, type, label, default}, ...] }
          } catch (e) {
            return;
          }

          var command = lang === 'js' ? 'node' : lang;

          var formEl = document.getElementById('job-manifest-form');
          var argsHtml = (manifest.args || []).map(function (arg) {
            var inputType = arg.type === 'number' ? 'number' : 'text';
            return '<label class="field-label">' + escapeHtml(arg.label || arg.name) +
              '<input type="' + inputType + '" data-arg-name="' + escapeHtml(arg.name) +
              '" value="' + escapeHtml(arg.default != null ? arg.default : '') + '"></label>';
          }).join('');

          // The shell's own form shape, which this predated: captioned
          // fields in a wrapping row with the button at the end of the
          // last one (§3). It was stacked labels with a private copy of
          // .field-label under an id, and a bare <h3> whose default top
          // margin was the space above the panel nobody asked for.
          formEl.innerHTML = '<div class="stat-tile wide">' +
            '<div class="panel-heading">' + escapeHtml(manifest.label || scriptPath) + '</div>' +
            '<div class="start-job-form card">' +
              argsHtml +
              '<button type="button" id="start-manifest-job" style="display:none">' + ICON.RUN + ' Start Job</button>' +
              '<button type="button" id="job-include-toggle" style="display:none"></button>' +
            '</div>' +
            // Under the row: something to read when it appears, not a
            // control on the line.
            '<div id="job-manifest-note" class="job-manifest-note"></div>' +
            '</div>';

          // ── ONLY WHAT THIS NODE INCLUDES (slim/G1.3 T9) ────────────────
          //
          // Andy: "i will test this with the imageStats process, in
          // fileViewer Launcher, it might have to give me the option to
          // include/exclude a process". Start Job is offered only for an
          // included process; the switch beside it asks twice, since a
          // process change weighs more than an app's (Andy: "re-arm
          // buttons"). The page cannot read relay-state/include.json, so it
          // asks config.searchModules, and switches with config.setModules.
          // process/js only: no other language's module exists yet (jobs.js).
          var modulePath = lang === 'js' ? 'process/js/' + match[2] : '';
          var included = false;
          var toggle = document.getElementById('job-include-toggle');
          var startBtn = document.getElementById('start-manifest-job');
          var note = document.getElementById('job-manifest-note');
          function drawInclude() {
            startBtn.style.display = included ? '' : 'none';
            toggle.style.display = modulePath ? '' : 'none';
            toggle.removeAttribute('data-armed');
            toggle.textContent = included ? 'Exclude from this node' : 'Include on this node';
          }
          function askIncluded() {
            if (!modulePath) return Promise.resolve();
            return Promise.resolve(spirit.core.ask('config.searchModules', { query: match[2] })).then(function (r) {
              var items = r && r.body && Array.isArray(r.body.items) ? r.body.items : [];
              included = items.some(function (i) { return i && i.key === modulePath; });
              drawInclude();
            }, function () { included = false; drawInclude(); });
          }
          toggle.addEventListener('click', function () {
            if (!toggle.hasAttribute('data-armed')) {
              toggle.setAttribute('data-armed', '');
              toggle.textContent = included ? 'Press again to exclude' : 'Press again to include';
              return;
            }
            var on = !included;
            Promise.resolve(spirit.core.ask('config.setModules', { path: modulePath, on: on })).then(function (r) {
              note.textContent = r && r.status === 200
                ? (on ? 'Included: it runs now if it is a server.' : 'Excluded: it stops at the next restart.')
                : 'Not changed: ' + ((r && r.text) || 'no answer');
              return askIncluded();
            });
          });
          askIncluded();

          document.getElementById('start-manifest-job').addEventListener('click', function () {
            var values = {};
            formEl.querySelectorAll('[data-arg-name]').forEach(function (input) {
              values[input.dataset.argName] = input.type === 'number' ? Number(input.value) : input.value;
            });
            spirit.core.jobs.start({
              command: command,
              args: [scriptPath, JSON.stringify(values)],
              type: manifest.label || match[2],
            });
            // Navigate immediately, don't wait on the request — the Jobs
            // app picks up the new job live via SSE either way.
            //
            // {replace: true}: starting the job is finishing with the
            // viewer, so Back from Jobs returns to whatever opened it —
            // Processes, or Files — rather than to the form you have
            // just spent (Andy). The third of three, and all three are a
            // viewer stepping out of its own way.
            launchApp('shell/jobs', null, { replace: true });
          });
        }

        // Shared by mount (first open) and loadFile (every later "Open with"
        // against a different file) — mount() itself only ever runs once
        // now that apps stay persistently mounted across navigation, so a
        // viewer that doesn't also implement loadFile would keep showing
        // whichever file it first opened, forever.
        // THE FILE ON CODEMIRROR (goal/G29.12): the text view shows it, the search words marked, the first in view.
        function codeViewerLoadFile(path, words, line) {
          setViewerTitle(path);
          var content = spirit.core.fs.loadFile(path);
          document.getElementById('cv-body').innerHTML =
            renderFileInfoBubble(path) +
            // Before Open with: which app this file IS outranks what else
            // could open it.
            '<div id="app-of-file"></div>' +
            // cv-, not a bare id: BOTH launchers draw an Open with, both
            // stay mounted once visited (switchTo keeps a pane per app),
            // and getElementById answers with whichever is first in the
            // document. Open a text file and then an image and the image
            // viewer's handlers were written into the text viewer's pane.
            '<div id="cv-open-with" class="open-with"></div>' +
            '<div id="job-manifest-form"></div>' +
            '<div id="cv-text" class="text-view"></div>' +
            renderAnnotationsSection(path);
          var cvText = document.getElementById('cv-text');
          window.spiritElements.createTextView(cvText, {
            text: content == null ? '(could not load file)' : content, words: words || '', line: line || 0, readOnly: true, path: path,
          });
          renderAppOfFile(document.getElementById('app-of-file'), path);
          renderOpenWith(document.getElementById('cv-open-with'), 'text-file-launcher', path);
          maybeRenderJobForm(document.getElementById('cv-body'), path);
        }

        registerApp({
          id: 'text-file-launcher',
          name: 'Text File Launcher',
          icon: ICON.CODE,
          hidden: true,
          // A launcher, not a dialog: it finishes with the file it was
          // showing, so it MAY launch — and every one of its launches
          // replaces its own stack entry. That is what keeps at most one
          // hidden app on the stack (assertOneHiddenApp, shell.js).
          type: 'launcher',
          mount: function (container, api, params) {
            container.innerHTML = '<div id="cv-body" class="stack"></div>';
            codeViewerLoadFile(params.path, params.words, params.line);
          },
          loadFile: function (path, params) {
            codeViewerLoadFile(path, params && params.words, params && params.line);
          },
          render: function () {}, // static between loadFile calls — the file's content doesn't live-update
        });

        // ---- Media Launcher app (image/audio/video) ----
        var MEDIA_TAG_BY_CATEGORY = {
          image: { tag: 'img', extraAttrs: '' },
          audio: { tag: 'audio', extraAttrs: ' controls' },
          video: { tag: 'video', extraAttrs: ' controls' },
        };

        // Same reasoning as codeViewerLoadFile, above.
        function mediaViewerLoadFile(path) {
          setViewerTitle(path);
          var category = classifyMimeType(mimeTypeForName(path));
          var tagInfo = MEDIA_TAG_BY_CATEGORY[category] || MEDIA_TAG_BY_CATEGORY.image;
          document.getElementById('mv-body').innerHTML =
            renderFileInfoBubble(path) +
            // mv-, for the reason above: two panes are alive at once and
            // a bare id belongs to whichever mounted first.
            '<div id="mv-open-with" class="open-with"></div>' +
            '<' + tagInfo.tag + ' class="media-view" src="/' + encodeURI(path) + '"' + tagInfo.extraAttrs + '></' + tagInfo.tag + '>' +
            renderAnnotationsSection(path);
          renderOpenWith(document.getElementById('mv-open-with'), 'media-launcher', path);
        }

        registerApp({
          id: 'media-launcher',
          name: 'Media Launcher',
          icon: ICON.VIEW,
          hidden: true,
          type: 'launcher', // as above: launches, and every launch replaces
          mount: function (container, api, params) {
            container.innerHTML = '<div id="mv-body" class="stack"></div>';
            mediaViewerLoadFile(params.path);
          },
          loadFile: function (path) {
            mediaViewerLoadFile(path);
          },
          render: function () {},
        });

        // ---- Groups app ----
        // Moved to app/group-manager/group-manager.js + its manifest
        // (CLEANUP-PLAN). Intrinsic, so it is declared at boot from that
        // manifest and reached through the Spirit group, exactly as it
        // was when it registered here hidden.

        // ---- Spirit app (launcher/grouping template) ----
        // Hosts a sub-view of the machine-introspection apps (Stats,
        // Processes, Jobs, Apps, Groups) — hidden from the real desktop
        // below — using the same reusable icon-grid template user-created
        // groups also build on (registerGroupApp, shell.js). Files stays a
        // front-page icon: it's a content-facing app you use, not a
        // system-introspection tool.
        registerApp({
          id: 'spirit',
          name: 'Spirit',
          icon: ICON.SPIRIT,
          mount: function (container, api, params) {
            container.innerHTML = '<div class="app-group-grid" id="spirit-group"></div>';
          },
          render: function () {
            var grid = document.getElementById('spirit-group');
            if (!grid) return;
            // The fixed built-in members, plus every intrinsic app the
            // shell discovered (Natter today). Intrinsic apps are part of
            // how the node works rather than something installed, so this
            // is their launcher home and the only one — the Location
            // picker cannot move them out (setAppOverride, shell.js).
            //
            // The two halves may overlap — they will, as the five below
            // move into app/<name>/ and become intrinsic. renderAppGroup
            // draws one tile per id, so this list does not have to know
            // what is already in it.
            renderAppGroup(grid, ['shell/stats', 'shell/jobs', 'shell/apps', 'shell/files', 'shell/group-manager', 'shell/contacts']
              .concat(spirit.shell.listIntrinsicApps()));
          },
        });

      })();
    </script>
  </body>
</html>
