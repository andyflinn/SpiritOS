<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpiritOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/js/kernel.js"></script>
    <!-- The isomorphic half of js/ownerBadge.js: the mailbox rules the
         browser has to obey too (Natter's Remove asks it whether this
         node may be left with fewer relays). Node-only code inside it
         never runs here. -->
    <script src="/js/ownerBadge.js"></script>
    <!-- One peer, one file, named by the peer's whole public key.
         js/chatLog.js reads this at load, so it comes first. -->
    <script src="/js/peerFile.js"></script>
    <!-- The isomorphic half of js/chatLog.js: how a conversation is
         filed on this node. Relay Chat holds the files through its own
         scoped api.fs; this only decides names, shapes and merging. -->
    <script src="/js/chatLog.js"></script>
    <!-- The envelope every app's traffic travels in, inside the mailbox's
         own `text` field. Isomorphic: the hub wraps with it in node, the
         apps read it here. -->
    <script src="/js/packet.js"></script>
    <!-- The ICON table read the other way round — one line per glyph,
         carrying every name it is keyed under. What the icon selector
         chooses from, and isomorphic so the grouping and the filtering
         can be asserted in node rather than only looked at. -->
    <script src="/js/iconIndex.js"></script>
    <style>
      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a2e;
        color: #eee;
      }

      #desktop {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 16px;
        padding: 24px;
        height: 100vh;
        align-content: start;
      }

      #desktop[hidden] { display: none; }

      /* Same grid the real desktop uses, scoped to a grouping app's own
         mount container (e.g. "spirit") rather than the full-viewport
         #desktop — no height:100vh, #app-content already provides padding. */
      .app-group-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 16px;
      }

      .app-icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 10px 4px;
        border-radius: 12px;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-icon:hover, .app-icon:active {
        background: rgba(255, 255, 255, 0.1);
      }

      .app-icon .icon { font-size: 40px; line-height: 1; }
      .app-icon .label { font-size: 13px; text-align: center; }

      #app-container {
        position: fixed;
        inset: 0;
        background: #16213e;
        overflow-y: auto;
      }

      #app-container[hidden] { display: none; }

      #app-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        position: sticky;
        top: 0;
        background: #0f3460;
        z-index: 1;
      }

      #app-close, #app-home, .titlebar-link {
        cursor: pointer;
        font-size: 22px;
        background: none;
        border: none;
        color: inherit;
        padding: 4px 8px;
      }

      #app-title { font-size: 16px; font-weight: 600; }
      #app-content { padding: 16px; }

      .titlebar-link {
        opacity: 0.75;
        margin-left: 8px;
        vertical-align: middle;
      }
      .titlebar-link:hover { opacity: 1; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }

      .stat-tile {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 12px;
      }

      .stat-tile.wide { grid-column: 1 / -1; }
      .stat-tile.clickable { cursor: pointer; }
      .stat-tile.clickable:hover { background: rgba(255, 255, 255, 0.12); }
      .stat-tile .value { font-size: 22px; font-weight: 700; }
      .stat-tile .label { font-size: 12px; opacity: 0.7; margin-top: 4px; }
      .stat-tile .rows { font-size: 13px; margin-top: 4px; }

      /* Label and value on the same line — dedicated to the file info
         bubble (renderFileInfoBubble), separate from .stat-tile .label/.rows
         above (stacked label-over-value), which other apps rely on as-is. */
      /* Reading size, the same as #app-title: a Path, an Id, a Members
         list are what the screen is about, not a footnote to it. If a
         line deserves to be smaller than this it is fine print, and fine
         print belongs at the bottom of a page rather than shrunk in the
         middle of one. Size only — the titlebar keeps its 600 weight, or
         the block below it starts competing with it.
         One row type, one voice: this is the launchers' info bubble, the
         Apps detail rows and the Groups panel alike. The label column
         grew with the text; at 16px "Default name" and "Changed" no
         longer fit 70px, and the values stopped aligning. */
      /* Wrapping, so on a genuinely narrow pane the value drops to its
         own line and gets the width instead of fighting a 90px label for
         it — the same thing .start-job-form does, and what §10 asks. */
      .file-info-row { display: flex; flex-wrap: wrap; gap: 8px; font-size: 16px; margin-top: 4px; }
      .file-info-row .file-info-label { opacity: 0.7; min-width: 90px; }

      /* min-width:0 is what actually lets a long value shrink. A flex
         item defaults to min-width:auto and refuses to go below its
         min-content width, which for a path with no spaces is the whole
         string — so the row pushed out of the pane and no wrapping rule
         was ever consulted.
         overflow-wrap:anywhere rather than break-word: only `anywhere`
         affects min-content sizing, so only `anywhere` works inside a
         flex row. It is the fallback for one segment longer than the
         line; <wbr> (pathValue, shell.js) is what makes it fold after a
         slash by preference. */
      .file-info-value, .fact-value { min-width: 0; overflow-wrap: anywhere; }

      /* The directories step back so the filename reads first — §2's own
         move, distinguished by dimming rather than by shrinking. The
         filename carries the weight because it is the subject: in the
         path bubble it IS the title of the screen. */
      .path-dir { opacity: 0.6; }
      .path-file { font-weight: 600; }

      /* Which file this is, as the title of the screen — its own bubble
         with no caption, because "Path:" was a word saying what the only
         thing in the bubble obviously is, and it took 90px of the width
         the path itself needed most (Andy). Reading size, like the
         titlebar it echoes: same size, and the weight above does the
         telling apart (§2). */
      .file-path { font-size: 16px; }

      #file-tree summary {
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
      }

      #file-tree summary:hover { background: rgba(255, 255, 255, 0.08); }

      .tree-children { margin-left: 20px; }

      .file-row {
        cursor: pointer;
        padding: 4px 4px 4px 24px;
        border-radius: 6px;
      }

      .file-row:hover { background: rgba(255, 255, 255, 0.08); }

      #file-detail { margin-top: 16px; }

      .code-view {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 10px;
        padding: 12px;
        overflow-x: auto;
        white-space: pre;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        margin-top: 12px;
      }

      textarea.code-view { width: 100%; box-sizing: border-box; resize: vertical; color: inherit; border: none; }

      .media-view { max-width: 100%; margin-top: 12px; display: block; }

      /* One rhythm down the viewer: the info bubble, the Open with line
         and the preview are three blocks, evenly spaced. The preview
         carries its own 12px (.code-view and .media-view above) and this
         is the matching gap above it — both launchers share this id, so
         they space identically.
         :empty because renderOpenWith writes '' when nothing declared
         the extension. An empty div still occupies its margin, which
         would push the preview 24px down on exactly the files that have
         no Open with — a bigger gap where there is less to see. */
      /* Collapsed rather than margin-cancelled when nothing declared the
         extension. §3 named the old :empty{margin-top:0} as a hack that
         only existed because space was carried downward; with the block
         below carrying its own, this is the same answer every other
         can-be-empty block gives (#rc-peer-strip, .job-start-error). */
      #open-with { margin-top: 12px; }
      #open-with:empty { display: none; }

      /* Which app a file IS, when it is one. Collapsed when it is not,
         like every other block that can be empty (§3). */
      #app-of-file:empty { display: none; }

      /* The identity takes the width so the button ends the row — the
         same job .field-label.grow does for a captioned field. */
      .app-of-file { flex: 1; min-width: 0; font-size: 16px; }
      .app-of-file-icon { font-size: 20px; margin-right: 8px; vertical-align: middle; }

      /* renderAnnotationsSection's "More Information" cards (shell.js) */
      .stat-tile.nested { margin-top: 8px; background: rgba(255, 255, 255, 0.04); }
      .annotation-raw summary { cursor: pointer; font-size: 13px; opacity: 0.8; }
      .annotation-raw pre { margin: 6px 0 0; }

      /* Only what is particular to it; the look comes from the control
         rules above. Same for every field below. */
      /* No margin-bottom: the list below carries its own space above it
         (§3), and it is a block in the pane's own stack. */
      #process-search { width: 100%; }

      /* The ownership mark: ★ means this node owns that mailbox, the
         same as in Relay Chat's To list. It is a mark and not a control
         — what opens the row is the row (.natter-openable) — so it takes
         no hit area of its own and the whole width is the target. */
      .natter-star { color: #ffd48a; font-size: 18px; line-height: 1; }
      .natter-openable { cursor: pointer; }

      .process-entry {
        cursor: pointer;
        padding: 8px;
        border-radius: 8px;
      }

      .process-entry:hover { background: rgba(255, 255, 255, 0.08); }
      .process-entry-label { font-weight: 600; }
      /* Reading size, not fine print. This is the sentence that says what
         a process DOES — the reason the list is worth reading at all — and
         §2 puts fine print at the foot of a page rather than shrunk in the
         middle of one. Told apart from its label the way §2 says: same
         size, different weight, and dimmed rather than shrunk. */
      .process-entry-desc { font-size: 16px; opacity: 0.75; margin-top: 2px; }

      /* One spacing scale: the 12px that separates blocks down a page
         (UI_DESIGN_STYLE.md) is also what separates controls across a
         row. Two gaps that are nearly the same read as a mistake rather
         than a distinction — this was 8px beside 12px everywhere else.
         flex-end so a caption-over-input pair (.field-label) lines its
         input up with the button beside it rather than floating above
         it; wrap so a narrow screen gets full-width targets stacked
         instead of one squeezed row. */
      /* No margin-bottom: whatever follows a row carries its own space
         above it (§3). Carried downward, a row that is not on the page
         leaves its gap behind — which is the hack #open-with:empty had to
         exist for.
         margin-top because a row IS a block and takes its space from
         above like one. At the top level of a pane the stack rule already
         said so and wins on specificity with the same number; inside a
         panel nothing did, so a form sat flush under whatever it
         followed — a facts bubble, a heading, another form. */
      .start-job-form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
        margin-top: 12px;
      }

      /* Unless it opens the box it is in — then the box's padding is the
         leading edge and a margin on top of it is that space twice. The
         same answer #app-content already gave: who supplies the first gap
         is the container, and only where the container supplies none does
         the first block bring its own. */
      .start-job-form:first-child { margin-top: 0; }

      /* A form is its own card only where it SHARES a panel with
         something else — a reading above it, another form beside it.
         Where the panel is the form, two boxes around one object is what
         you see, and Jobs, the Groups create form and Contacts'
         add-by-handle were all exactly that (Andy).
         So it is asked for rather than automatic. `.stat-tile .start-job-form`
         was the first try and it could not tell the two cases apart. */
      .start-job-form.card {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 12px;
      }

      /* Inside a row the gap does the spacing, so the pair drops its own
         vertical margins — otherwise it sits 8px higher than the button
         it is meant to line up with. */
      .start-job-form .field-label { margin: 0; }

      /* Whatever follows a row takes its space from it (§3). The row used
         to push this down with a margin-bottom; carried that way it left
         its gap behind on screens where the row is not drawn, which is
         the hack #open-with:empty existed for. Turning it round left the
         followers flush — a Delete under a Groups row, an error line
         under Create, a minted token under Invite — because those sit
         inside a panel rather than in the pane's own stack. */
      .start-job-form + * { margin-top: 12px; }

      /* A button in a row of CAPTIONED fields reserves the caption's
         line, so wrapping keeps the rhythm (Andy). On one line
         align-items:flex-end already lines the button up with the
         inputs; the moment the row wraps and the button lands alone, its
         line is a caption shorter than every other, and the block reads
         as if the button were hugging the field above it.
         20px is the 13px caption line plus the 4px .field-label gap.
         :has() so a row of BARE inputs is untouched — Contacts'
         add-by-handle is a search box and its button with nothing
         written over either, and a top margin there would push the
         button out of line with the input it belongs to. (Jobs' form was
         the example until it got captions of its own.) Where :has() is
         not understood nothing happens, which is exactly today's
         behaviour. */
      .start-job-form:has(.field-label) > button { margin-top: 20px; }

      /* The field that should take whatever the row does not: a caption
         and its input filling the line, with the buttons pushed to the
         end. Opt-in rather than the default for every label in a row —
         Natter's bind line puts three of them side by side on purpose,
         and they are meant to share the width evenly. */
      .start-job-form > .field-label.grow { flex: 1; }

      /* A form row wraps rather than scrolls: on a portrait phone the
         input takes the width and the button drops under it, which is
         two full-width targets instead of one squeezed pair. */
      .start-job-form input { flex: 1; min-width: 140px; }

      /* The titlebar's own bail-out button (setViewerTitle) is chrome,
         not a field, so it keeps the small shape. Inside an app,
         #app-content button wins on specificity. */
      .cancel-btn {
        padding: 6px 12px;
        border-radius: 8px;
        border: none;
        background: #0f3460;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }

      .cancel-btn:hover { background: #16487a; }

      /* ---- Controls ----------------------------------------------
         One look for every input, select and button an app puts on the
         page: a rounded box, a dark fill, reading-size text, and a
         target big enough for a thumb.
         This used to be five near-identical copies living beside their
         own forms — #process-search, .start-job-form, .field-label,
         #job-manifest-form and the Relay Chat rows — each 6px padding
         and 6px radius, drifting one edit at a time. Scoped to
         #app-content because that is where an app's own markup lives;
         the titlebar keeps its small buttons, which are chrome rather
         than something you fill in.
         16px is not only the reading size: any control smaller than
         that makes iOS zoom the whole page on focus, which leaves you
         scrolled sideways in a layout you did not ask for. 44px is the
         smallest target that is comfortable to hit on a portrait
         phone. Both of those are why this file cares about the size at
         all — see UI_DESIGN_STYLE.md. */
      #app-content input,
      #app-content select,
      #app-content button,
      #app-content textarea:not(.code-view) {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
        font-size: 16px;
        min-height: 44px;
        max-width: 100%;
      }

      #app-content button {
        border: none;
        background: #0f3460;
        cursor: pointer;
        padding: 10px 16px;
      }

      #app-content button:hover { background: #16487a; }

      /* A native dropdown paints its popup with the control's OWN
         colours. A translucent background (rgba over a dark page) lands
         as near-white behind near-white text once the OS draws the list
         on its own layer — readable in the closed control, unreadable
         open. Opaque on both the select and its options, everywhere in
         the shell, since every app that grows a dropdown inherits this
         problem. color-scheme asks the browser for dark popup chrome;
         the option colours are the belt-and-suspenders for engines that
         only honour explicit colours. */
      select {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #0f3460;
        color: #eee;
        font: inherit;
        color-scheme: dark;
      }

      #app-content select { background: #0f3460; }

      select option { background: #16213e; color: #eee; }

      /* Same look as #job-manifest-form's fields, scoped by class instead
         of that one form's id, so other edit forms (e.g. the Apps table's
         per-app edit panel) can reuse it without duplicating the rules. */
      .field-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 0;
        font-size: 13px;
      }

      /* No min-height: a note that reserves a line for a message nobody
         has written is §1 in CSS, and it was the empty space under the
         process form. Collapsed when empty, like every other block that
         can be (§3). Its size is still the open question §2 names — 12px
         mid-page — and it is shared with the Apps and Contacts notes, so
         it is not this sitting's to settle. */
      .job-manifest-note { font-size: 12px; opacity: 0.75; margin-top: 12px; }

      .job-manifest-note:empty { display: none; }

      /* The icon selector (createIconSelector, shell.js). A closed field
         that drops a list we paint, rather than a native <select>: the
         glyph has to lead every line for the column to scan, and native
         type-ahead can only match a prefix of the whole option text, so
         the only typeable prefix would have been the emoji itself. The
         filter here reads every name on every line instead. */
      /* A floor, so a row can never squeeze the words off it. Without
         one, flex shrinks this to the glyph and its caret — the names
         are the whole reason the list is readable, and the dropdown is
         pinned to the field's edges, so a squashed field gives a
         squashed list.
         260px is `Arrowright, Forward` — the longest line in the pool —
         plus the glyph column, the gap, the padding and the caret.
         With it declared, .start-job-form's own wrap does the rest: a
         row that cannot fit this at its minimum drops it onto its own
         line, and nothing has to count how many fields are in the row. */
      .icon-selector { position: relative; min-width: 260px; }

      /* Reads at the size the titlebar does — this is the row's content,
         not its fine print. */
      .icon-selector-field {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 6px 12px;
        border: none;
        border-radius: 8px;
        background: #0f3460;
        color: inherit;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
        text-align: left;
      }

      .icon-selector-field:hover { background: #16487a; }

      /* One fixed column for the picture, so 129 of them line up down the
         left edge and the eye can run the list without reading it. */
      .icon-selector-glyph {
        flex: 0 0 auto;
        width: 24px;
        font-size: 20px;
        line-height: 1;
        text-align: center;
      }

      .icon-selector-name { flex: 1; min-width: 0; }

      .icon-selector-caret { flex: 0 0 auto; opacity: 0.6; font-size: 12px; }

      /* Over the panel, not in it: opening the list must not push the
         rest of the row down the page. */
      /* Its own floor as well as the field's. The list is pinned to the
         field's edges, so it would otherwise inherit any squeeze — and a
         line of names that has to scroll sideways is a line nobody
         reads. */
      .icon-selector-list {
        min-width: 260px;
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #16213e;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      .icon-selector-filter {
        width: 100%;
        margin-bottom: 12px;
        font-size: 16px;
      }

      .icon-selector-rows { max-height: 40vh; overflow-y: auto; }

      /* One row type, one voice: the same shape as the closed field, so
         picking a line and then reading it back says the same thing. */
      .icon-selector-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 6px 12px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
        text-align: left;
      }

      .icon-selector-row:hover,
      .icon-selector-row.is-active { background: #0f3460; }

      /* No min-height and no margin under it. Reserving a line for a
         message that is not there is exactly what §1 forbids, and here it
         was the bottom half of 48px of nothing below the Jobs form: the
         row's 12px, a blank line held open, 8px beneath it, then the
         panel's own padding.
         Collapsed when empty, the way #rc-peer-strip is — a block that
         can be empty collapses to nothing (§3), and its margin goes with
         it. The panel grows when an error appears, which is the moment
         you want the eye pulled anyway. */
      .job-start-error {
        color: #ff8080;
        font-size: 13px;
      }

      .job-start-error:empty { display: none; }

      .jobs-table { width: 100%; border-collapse: collapse; font-size: 13px; }

      .jobs-table th, .jobs-table td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .job-row { cursor: pointer; }
      .job-row:hover { background: rgba(255, 255, 255, 0.06); }

      .job-log-row td { padding: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }

      .job-log-panel {
        background: rgba(0, 0, 0, 0.25);
        padding: 10px 14px;
        max-height: 240px;
        overflow-y: auto;
        font-size: 12px;
      }

      .job-log-entry { padding: 2px 0; }
      .job-log-time {
        opacity: 0.6;
        margin-right: 8px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .job-log-empty { opacity: 0.6; font-style: italic; }

      /* Relay Chat's thread (chat 3). Deliberately the same panel the
         Jobs log already uses — this is the shell's bones, not a second
         design system. Two message shapes, yours and theirs, told apart
         by weight and a tint rather than by bubbles. */
      #rc-thread { max-height: 55vh; margin-bottom: 12px; }

      .rc-msg { display: flex; gap: 10px; padding: 3px 6px; border-radius: 6px; }
      .rc-msg .rc-time {
        opacity: 0.5;
        font-family: ui-monospace, Consolas, monospace;
        white-space: nowrap;
      }
      .rc-msg .rc-who { opacity: 0.85; font-weight: 600; white-space: nowrap; }
      .rc-msg .rc-text { flex: 1; }
      .rc-msg.me { background: rgba(255, 255, 255, 0.06); }
      .rc-msg.me .rc-who { color: #8ec9ff; }
      .rc-msg.them .rc-who { color: #ffd48a; }

      /* The thread scrolls inside its own panel, so the composer is
         always on screen without being pinned there — and pinning it
         would float it over the invite panel that now sits below. Flow
         order is the layout: thread, composer, invite. */
      #rc-composer { margin: 10px 0 14px; }
      #rc-to-bar { margin-bottom: 12px; }
      #rc-to-bar input { flex: 1; min-width: 120px; }

      /* The To control carries a caption, an owned marker and a URL on
         one line, so it gets the width of the page rather than of its
         longest option. */
      .rc-wide { width: 100%; margin-bottom: 10px; }

      /* What an unbound node has to read. It is not a footnote to a page
         of controls — while this shows, it IS the page, so it is set at
         reading size rather than at the 12px of .job-manifest-note. It
         shares the claim tile rather than owning one of its own: two
         bubbles of different widths read as two unrelated things. */
      #rc-unbound {
        font-size: 16px;
        line-height: 1.55;
        margin-bottom: 12px;
      }

      /* Same row, same gap as .start-job-form above — this one is not a
         .start-job-form only because it lives inside the unbound tile
         with the paragraph that explains it. */
      #rc-claim-fields {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      /* Every folded panel, said once. This was a list of ids — and by
         the time anybody looked, three of the four named panels had
         moved out of Relay Chat (invite to Natter, add-someone and the
         stranger policy to Contacts) and the two that arrived in
         Contacts were left with no pointer cursor at all: a fold that
         does not look clickable.
         A rare job, one line until it is wanted. Same size, same marker,
         same weight, wherever it is.
         The [open] half went with the list: it pushed the body down with
         a margin-bottom on the summary, and a fold's body carries its
         own space above it now (§3) — .start-job-form, the choices
         block, a nested tile all bring theirs. */
      details.stat-tile > summary {
        cursor: pointer;
      }

      /* The open conversation and the decision about it share a line:
         the To control takes the width, the button sits at its right.
         The select keeps its full width when there is no button, because
         an empty span takes no room (:empty) and the row's gap goes with
         it. */
      #rc-to-row { align-items: center; }
      #rc-to-row #rc-to-pick { flex: 1; width: auto; margin-bottom: 0; }
      #rc-peer-strip:empty { display: none; }

      /* The choices are a block, and a block carries the gap above itself
         (§3). On top of the space a summary keeps from its body, because
         a list of radios reads as part of the title otherwise.

         This rule followed the panel from Relay Chat to Contacts; the
         chat copy was left behind pointing at an element that no longer
         existed. */
      #contacts-unknown-choices { margin-top: 12px; }

      /* A handful of short facts read as ONE line, not as a list. Used
         where a row has already supplied the heading, so the facts under
         it are a single reading rather than four label-over-value rows
         stacked into a table: what a mailbox reports in Natter, and who a
         contact is in the row that opened.

         Was .natter-facts, named for the one app that had it. One row
         type, one voice (§4) — the shape is not Natter's, so neither is
         the name.

         Wraps rather than scrolls: on a narrow screen the facts stack,
         they do not vanish off the side. */
      /* A bubble of its own, so a reading is visibly not the controls
         beside it. Same card-inside-a-card ground .stat-tile.nested uses,
         and the same 10px roundness as the panel it sits in. */
      .fact-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 12px;
      }

      /* Label and value centre on each other, not on the left edge — a
         short caption over a long value, or the other way round, reads as
         one block rather than two ragged lines. align-items is the
         horizontal axis here because the fact is a column; text-align
         carries it into a value that wraps. */
      .fact {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* Caption above value, and the caption is the small bold half: you
         scan the labels to find the one you want, then read the value at
         reading size (§2). The opposite way round from .stat-tile's
         figure-over-caption, where the number is the thing being read and
         the caption only says what it is. */
      .fact-label { font-size: 12px; font-weight: 600; opacity: 0.75; }
      .fact-value { font-size: 16px; }

      /* The other half of the rule above: the td gives the last block
         the same space at the bottom, because what follows is another
         row and a row has nothing to carry. */
      .job-log-row > td { padding-bottom: 12px; }

      .natter-mint { margin-top: 12px; }

      /* The relay list reads at heading size: these rows are the subject
         of this app, not a table of records to scan. The shared
         .jobs-table stays 13px for Jobs, which is a log. */
      .natter-table th, .natter-table td { font-size: 16px; }

      /* Names the mailbox a claim will happen on, which the form itself
         cannot ask about — see natterPaintBind. Same weight as the mint
         heading: both are the title of a thing to do. */
      /* A heading inside a panel: reading size, and no browser margin of
         its own. Was .natter-bind-heading and .natter-mint-heading, two
         names for one look — and the process form used a bare <h3>, whose
         default ~21px top margin was the space nobody asked for above it
         (Andy). Three callers, one class (§4). */
      .panel-heading { font-size: 16px; margin: 0; }

      /* The one heading in that panel: the facts above are a reading of
         the row that opened them, but this is a thing to do. Reading
         size, and the same ★ the row carries for owning the mailbox. */


      /* All the labels in this panel read at the same size — the form's
         captions included. Scoped here rather than changed shell-wide:
         .field-label is shared with Jobs, Contacts and the claim row,
         and none of those asked. */
      .natter-mint .field-label { font-size: 16px; }

      /* ---- Space belongs to the block that follows it ----
         A block carries the gap ABOVE itself, never below. Then a block
         that is not on the page contributes nothing: no trailing margin
         left hanging where it used to be, and no :empty rule to cancel
         one — the two hacks this replaces (#open-with:empty, and the
         12px that had to sit on the panel ABOVE the invite slot because
         the slot is empty for a node that owns no mailbox).
         The first block in a stack has nothing above it to be separated
         from, so it takes the space back. */
      /* §3, said once instead of once per pair.
         This used to be seven selectors naming which KINDS of block space
         themselves from which other kinds — .stat-tile after .stat-tile,
         a table after a panel, a fold after a table. That list is
         quadratic in block types and the gaps it misses are silent: two
         blocks simply sit flush and the page reads a little cramped.
         It is how Natter's mint bubble arrived with no space above a
         rule that already forbade it.
         `> * + *` names no types, so a new kind of block is spaced the
         day it is added, by nobody.
         On containers that hold BLOCKS, never on a panel's contents — a
         .file-info-row is 4px from the row above it and is not a block.
         Stats needs no exception: it renders one child, so this never
         matches there. */
      /* §3, said once instead of once per pair.
         Who supplies the space above the FIRST block is the box it sits
         in, and the two boxes answer differently:
         #app-content has 16px of padding, and that padding IS the space
         under the titlebar. A margin on the first block as well is 28px
         where 16 was meant — visible, and nobody asked for it.
         An expanded row has 6px of cell padding, which is not a gap, so
         there the first block does bring its own — the rule that comment
         has always stated, and that the first pass at this quietly took
         away by writing `+ *` for both. */
      #app-content > .app-pane > * + *,
      .stack > * + *,
      .job-log-row > td > * { margin-top: 12px; }

      /* .stack is any OTHER box that holds blocks. Both launchers write
         their whole page into a wrapper (#cv-body, #mv-body) so a later
         loadFile can replace it, and while that wrapper said nothing the
         rule stopped at the pane's only child — the path bubble and the
         facts bubble under it sat flush, and so did the annotation cards.
         The same thing .app-pane was before it was named. Say what a box
         is and the rule finds it; name boxes in a list and the list goes
         stale (§4). */

      /* And the pane itself takes none. It is not a block, it is the
         box the blocks are in — every app has one and they are siblings
         under #app-content, all hidden but the open one (switchTo,
         shell.js). A margin here is a gap above the whole app and none
         between anything in it. */
      #app-content > .app-pane { margin-top: 0; }

      /* A fold is the other case: its <summary> IS the first child, and
         it belongs against the panel's own top edge. So here `+ *` is
         right — it starts the rhythm at the body, one block below the
         heading that introduces it. */
      #rc-settings-panel > * + * { margin-top: 12px; }

      /* A question inside Settings. .stat-tile.nested is already the
         shell's word for a card inside a card (it is what the annotation
         sections use), so a sub-panel needs no look of its own — the
         space comes from the stack rule above, which also puts the first
         one clear of the summary. */

      /* The folded panels at the foot of Relay Chat are separate offers,
         not one block: the same 12px that separates blocks everywhere
         else (§3). On each panel rather than the slot below them,
         because the invite slot is empty for a node that owns no mailbox
         and an empty div would still hold its margin. */
      /* Both are .stat-tile details, so the rule above already spaces
         them from whatever precedes them. Nothing to carry downward. */

      /* A choice is a button, a name and a sentence. Two columns: the
         button in the first, the name and its explanation stacked in the
         second — so the explanation is left-aligned with the name it
         belongs to rather than with the button, and the name sits on the
         button's own line. */
      .rc-choice {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 10px;
        align-items: center;
        margin-bottom: 12px;
        cursor: pointer;
      }

      .rc-choice-title { font-size: 16px; }

      /* Fine print, under the name and never under the button. */
      .rc-choice-note {
        grid-column: 2;
        font-size: 12px;
        opacity: 0.75;
        margin-top: 2px;
      }

      /* A checkbox is not a text field either, and for the same reason.
         Same size as a radio, so a list of settings reads as one list. */
      #app-content input[type="checkbox"] {
        width: 20px;
        height: 20px;
        min-height: 0;
        padding: 0;
        margin: 0;
        border: none;
        background: none;
        accent-color: #8ec9ff;
      }

      /* A setting that is a single switch, sitting among the folds. It
         is a .rc-choice for its layout and a .stat-tile.nested for its
         weight — the same card as a section, so the panel reads as a
         list of settings rather than a mixture of shapes. */
      #rc-dnd { margin-bottom: 12px; }

      /* A radio is not a text field. The shared control rule gives every
         input in an app a padded 44px box with a border, which is right
         for something you type in and absurd for something you tick —
         so this one takes back its own shape and keeps a size that is
         still findable with a thumb. */
      #app-content input[type="radio"] {
        width: 20px;
        height: 20px;
        min-height: 0;
        padding: 0;
        margin: 0;
        border: none;
        background: none;
        accent-color: #8ec9ff;
      }

      @media (max-width: 480px) {
        .app-icon .icon { font-size: 32px; }
        .app-icon .label { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <div id="desktop"></div>

    <div id="app-container" hidden>
      <div id="app-header">
        <button id="app-close" type="button" title="Back">⬅️</button>
        <button id="app-home" type="button" title="Home">🏠</button>
        <div id="app-title"></div>
      </div>
      <div id="app-content"></div>
    </div>

    <script src="/js/client/shell.js"></script>
    <script>
      (function () {
        var ICON = spirit.core.const.ICON;
        var registerApp = spirit.shell.registerApp;
        var launchApp = spirit.shell.launchApp;
        var escapeHtml = spirit.shell.escapeHtml;
        var renderOpenWith = spirit.shell.renderOpenWith;
        var renderAppOfFile = spirit.shell.renderAppOfFile;
        var findJobByType = spirit.shell.findJobByType;
        var mimeTypeForName = spirit.shell.mimeTypeForName;
        var classifyMimeType = spirit.shell.classifyMimeType;
        var iconForFile = spirit.shell.iconForFile;
        var CATEGORY_APP_HANDLERS = spirit.shell.CATEGORY_APP_HANDLERS;
        var setViewerTitle = spirit.shell.setViewerTitle;
        var renderFileInfoBubble = spirit.shell.renderFileInfoBubble;
        var renderAnnotationsSection = spirit.shell.renderAnnotationsSection;
        var renderAppGroup = spirit.shell.renderAppGroup;
        var listApps = spirit.shell.listApps;
        var getAppOverride = spirit.shell.getAppOverride;
        var setAppOverride = spirit.shell.setAppOverride;
        var fileInfoRow = spirit.shell.fileInfoRow;
        var listGroups = spirit.shell.listGroups;
        var createGroup = spirit.shell.createGroup;
        var updateGroup = spirit.shell.updateGroup;
        var deleteGroup = spirit.shell.deleteGroup;

        // ---- Files app ----
        // Moved to app/files/files.js + files.json (CLEANUP-PLAN). It is
        // intrinsic now, so it is declared at boot from its manifest and
        // its tile lives in the Spirit group; the two launchers below
        // stay here, and Files opens them through api.launchApp.

        // ---- Text File Launcher app ----
        // Only reachable via launchApp('text-file-launcher', { path }) from Files or
        // the Processes app — no desktop icon (hidden: true).
        // Cross-references a live LM Studio model list against the vision
        // probe's results.json (if it has ever been run), so the dropdown
        // can hide models that are KNOWN to fail rather than trusting a
        // model's own self-reported vision-capability claim. Untested models
        // (not yet probed, e.g. installed after the last run) still show —
        // only confirmed failures are excluded, so a genuinely new model
        // never gets hidden just because the probe hasn't seen it yet. If no
        // probe has ever run, this is a no-op: unfiltered, exactly today's
        // behavior.
        function classifyModelsAgainstProbe(liveIds) {
          var probeRaw = spirit.core.fs.loadFile('process/js/lmStudioVisionProbe/results.json');
          var resultByModel = {};
          var testedAt = null;
          if (probeRaw != null) {
            try {
              var probe = JSON.parse(probeRaw);
              testedAt = probe.testedAt || null;
              (probe.results || []).forEach(function (r) { resultByModel[r.model] = r; });
            } catch (e) { /* malformed/missing probe data — fall back to unfiltered */ }
          }
          var classified = liveIds
            .filter(function (id) {
              var r = resultByModel[id];
              return !r || r.success !== false; // only exclude CONFIRMED failures
            })
            .map(function (id) {
              var r = resultByModel[id];
              return {
                id: id,
                verified: !!(r && r.success === true),
                sizeBytes: r && r.sizeBytes != null ? r.sizeBytes : null,
                fitsInVram: r && r.fitsInVram != null ? r.fitsInVram : null,
              };
            });
          classified.sort(function (a, b) { return (b.verified ? 1 : 0) - (a.verified ? 1 : 0); });
          return { classified: classified, testedAt: testedAt };
        }

        function maybeRenderJobForm(container, scriptPath) {
          var match = scriptPath.match(/^process\/([^/]+)\/([^/]+)\/(.+)\.js$/);
          if (!match) return;

          var lang = match[1]; // 'js' -> node, anything else used as the literal command name
          var manifestPath = scriptPath.replace(/\.js$/, '.json');
          var manifestRaw = spirit.core.fs.loadFile(manifestPath);
          if (manifestRaw == null) return; // no manifest, no form — just a plain code view

          var manifest;
          try {
            manifest = JSON.parse(manifestRaw); // { label, description?, args: [{name, type, label, default}, ...] }
          } catch (e) {
            return;
          }

          var command = lang === 'js' ? 'node' : lang;

          var formEl = document.getElementById('job-manifest-form');
          var argsHtml = (manifest.args || []).map(function (arg) {
            if (arg.type === 'lm-studio-model' || arg.type === 'lm-studio-model-unloaded' || arg.type === 'lm-studio-model-loaded') {
              // Three flavors of the same dropdown, sharing the population
              // logic below: 'lm-studio-model' cross-references the vision
              // probe (for captioning-style scripts); 'unloaded'/'loaded'
              // filter by live state (for load/unload scripts — showing an
              // already-loaded model in the Load dropdown would let you
              // spawn a wasteful duplicate instance, confirmed live).
              // Rendered disabled with just the manifest default until the
              // live fetch below resolves — never blocks starting the job
              // on that fetch, since the default is already a valid value.
              var lmFilter = arg.type === 'lm-studio-model' ? 'vision' : (arg.type === 'lm-studio-model-unloaded' ? 'unloaded' : 'loaded');
              return '<label class="field-label">' + escapeHtml(arg.label || arg.name) +
                '<select data-arg-name="' + escapeHtml(arg.name) + '" data-lm-studio-model-select data-lm-studio-filter="' + lmFilter + '" disabled>' +
                '<option value="' + escapeHtml(arg.default || '') + '">' + escapeHtml(arg.default || '(loading models…)') + '</option>' +
                '</select></label>';
            }
            var inputType = arg.type === 'number' ? 'number' : 'text';
            return '<label class="field-label">' + escapeHtml(arg.label || arg.name) +
              '<input type="' + inputType + '" data-arg-name="' + escapeHtml(arg.name) +
              '" value="' + escapeHtml(arg.default != null ? arg.default : '') + '"></label>';
          }).join('');

          // The shell's own form shape, which this predated: captioned
          // fields in a wrapping row with the button at the end of the
          // last one (§3). It was stacked labels with a private copy of
          // .field-label under an id, and a bare <h3> whose default top
          // margin was the space above the panel nobody asked for.
          formEl.innerHTML = '<div class="stat-tile wide">' +
            '<div class="panel-heading">' + escapeHtml(manifest.label || scriptPath) + '</div>' +
            '<div class="start-job-form card">' +
              argsHtml +
              '<button type="button" id="start-manifest-job">' + ICON.RUN + ' Start Job</button>' +
            '</div>' +
            // Under the row: something to read when it appears, not a
            // control on the line.
            '<div id="job-manifest-note" class="job-manifest-note"></div>' +
            '</div>';

          document.getElementById('start-manifest-job').addEventListener('click', function () {
            var values = {};
            formEl.querySelectorAll('[data-arg-name]').forEach(function (input) {
              values[input.dataset.argName] = input.type === 'number' ? Number(input.value) : input.value;
            });
            spirit.core.jobs.start({
              command: command,
              args: [scriptPath, JSON.stringify(values)],
              type: manifest.label || match[2],
            });
            // Navigate immediately, don't wait on the request — the Jobs
            // app picks up the new job live via SSE either way.
            //
            // {replace: true}: starting the job is finishing with the
            // viewer, so Back from Jobs returns to whatever opened it —
            // Processes, or Files — rather than to the form you have
            // just spent (Andy). The third of three, and all three are a
            // viewer stepping out of its own way.
            launchApp('app/jobs', null, { replace: true });
          });

          // Populate any LM-Studio-model dropdowns live, without blocking the
          // rest of the form — if LM Studio isn't running, fall back to a
          // plain text input pre-filled with the manifest default rather
          // than leaving the field stuck disabled.
          formEl.querySelectorAll('[data-lm-studio-model-select]').forEach(function (select) {
            var argName = select.dataset.argName;
            var defaultValue = select.value;
            var filter = select.dataset.lmStudioFilter; // 'vision' | 'unloaded' | 'loaded'
            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, 2000);

            // Goes through our own server's generic /api/proxy route, not
            // LM Studio directly — LM Studio sends no Access-Control-Allow-
            // Origin header, so a cross-origin browser fetch to it would be
            // silently blocked by CORS even when it's perfectly reachable.
            // The proxy itself knows nothing about LM Studio — this caller
            // supplies the target and owns parsing LM Studio's raw response
            // shape. Load-state filtering needs LM Studio's native
            // /api/v0/models (the plain OpenAI-compatible /v1/models used
            // for the vision-probe case doesn't report `state` at all).
            var targetUrl = filter === 'vision' ? 'http://localhost:1234/v1/models' : 'http://localhost:1234/api/v0/models';

            fetch('/api/proxy', {
              method: 'POST',
              signal: controller.signal,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: targetUrl, timeoutMs: 2000 }),
            })
              .then(function (res) {
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error('proxy returned ' + res.status);
                return res.json();
              })
              .then(function (body) {
                var liveModels = body.data || [];
                if (liveModels.length === 0) throw new Error('no models currently loaded');

                if (filter === 'unloaded' || filter === 'loaded') {
                  var filtered = liveModels.filter(function (m) {
                    return filter === 'loaded' ? m.state === 'loaded' : m.state !== 'loaded';
                  });
                  if (filtered.length === 0) throw new Error('no ' + filter + ' models');
                  select.innerHTML = filtered.map(function (m) {
                    return '<option value="' + escapeHtml(m.id) + '"' + (m.id === defaultValue ? ' selected' : '') + '>' + escapeHtml(m.id) + '</option>';
                  }).join('');
                  select.disabled = false;
                  return;
                }

                var ids = liveModels.map(function (m) { return m.id; });
                var probeResult = classifyModelsAgainstProbe(ids);
                select.innerHTML = probeResult.classified.map(function (entry) {
                  var label = entry.id +
                    (entry.sizeBytes != null ? ' (' + spirit.core.util.formatBytes(entry.sizeBytes) + ')' : '') +
                    (entry.verified ? ' ' + ICON.OK : '') +
                    (entry.fitsInVram === false ? ' ' + ICON.WARNING : '');
                  return '<option value="' + escapeHtml(entry.id) + '"' + (entry.id === defaultValue ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
                }).join('');
                select.disabled = false;
                if (probeResult.testedAt) {
                  var probeNote = document.getElementById('job-manifest-note');
                  if (probeNote) probeNote.textContent = 'Filtered using vision-probe results from ' + new Date(probeResult.testedAt).toLocaleString() + '.';
                }
              })
              .catch(function () {
                clearTimeout(timeoutId);
                var fallback = document.createElement('input');
                fallback.type = 'text';
                fallback.dataset.argName = argName;
                fallback.value = defaultValue;
                fallback.title = 'LM Studio unreachable — enter the model id manually';
                select.replaceWith(fallback);
                var note = document.getElementById('job-manifest-note');
                if (note) note.textContent = 'LM Studio not reachable — enter the model id manually.';
              });
          });
        }

        // Shared by mount (first open) and loadFile (every later "Open with"
        // against a different file) — mount() itself only ever runs once
        // now that apps stay persistently mounted across navigation, so a
        // viewer that doesn't also implement loadFile would keep showing
        // whichever file it first opened, forever.
        function codeViewerLoadFile(path) {
          setViewerTitle(path);
          var content = spirit.core.fs.loadFile(path);
          document.getElementById('cv-body').innerHTML =
            renderFileInfoBubble(path) +
            // Before Open with: which app this file IS outranks what else
            // could open it.
            '<div id="app-of-file"></div>' +
            '<div id="open-with"></div>' +
            '<div id="job-manifest-form"></div>' +
            '<pre class="code-view">' + escapeHtml(content == null ? '(could not load file)' : content) + '</pre>' +
            renderAnnotationsSection(path);
          renderAppOfFile(document.getElementById('app-of-file'), path);
          renderOpenWith(document.getElementById('open-with'), 'text-file-launcher', path);
          maybeRenderJobForm(document.getElementById('cv-body'), path);
        }

        registerApp({
          id: 'text-file-launcher',
          name: 'Text File Launcher',
          icon: ICON.CODE,
          hidden: true,
          mount: function (container, api, params) {
            container.innerHTML = '<div id="cv-body" class="stack"></div>';
            codeViewerLoadFile(params.path);
          },
          loadFile: function (path) {
            codeViewerLoadFile(path);
          },
          render: function () {}, // static between loadFile calls — the file's content doesn't live-update
        });

        // ---- Media Launcher app (image/audio/video) ----
        var MEDIA_TAG_BY_CATEGORY = {
          image: { tag: 'img', extraAttrs: '' },
          audio: { tag: 'audio', extraAttrs: ' controls' },
          video: { tag: 'video', extraAttrs: ' controls' },
        };

        // Same reasoning as codeViewerLoadFile, above.
        function mediaViewerLoadFile(path) {
          setViewerTitle(path);
          var category = classifyMimeType(mimeTypeForName(path));
          var tagInfo = MEDIA_TAG_BY_CATEGORY[category] || MEDIA_TAG_BY_CATEGORY.image;
          document.getElementById('mv-body').innerHTML =
            renderFileInfoBubble(path) +
            '<div id="open-with"></div>' +
            '<' + tagInfo.tag + ' class="media-view" src="/' + encodeURI(path) + '"' + tagInfo.extraAttrs + '></' + tagInfo.tag + '>' +
            renderAnnotationsSection(path);
          renderOpenWith(document.getElementById('open-with'), 'media-launcher', path);
        }

        registerApp({
          id: 'media-launcher',
          name: 'Media Launcher',
          icon: ICON.VIEW,
          hidden: true,
          mount: function (container, api, params) {
            container.innerHTML = '<div id="mv-body" class="stack"></div>';
            mediaViewerLoadFile(params.path);
          },
          loadFile: function (path) {
            mediaViewerLoadFile(path);
          },
          render: function () {},
        });

        // ---- Groups app ----
        // Moved to app/group-manager/group-manager.js + its manifest
        // (CLEANUP-PLAN). Intrinsic, so it is declared at boot from that
        // manifest and reached through the Spirit group, exactly as it
        // was when it registered here hidden.

        // ---- Spirit app (launcher/grouping template) ----
        // Hosts a sub-view of the machine-introspection apps (Stats,
        // Processes, Jobs, Apps, Groups) — hidden from the real desktop
        // below — using the same reusable icon-grid template user-created
        // groups also build on (registerGroupApp, shell.js). Files stays a
        // front-page icon: it's a content-facing app you use, not a
        // system-introspection tool.
        registerApp({
          id: 'spirit',
          name: 'Spirit',
          icon: ICON.SPIRIT,
          mount: function (container, api, params) {
            container.innerHTML = '<div class="app-group-grid" id="spirit-group"></div>';
          },
          render: function () {
            var grid = document.getElementById('spirit-group');
            if (!grid) return;
            // The fixed built-in members, plus every intrinsic app the
            // shell discovered (Natter today). Intrinsic apps are part of
            // how the node works rather than something installed, so this
            // is their launcher home and the only one — the Location
            // picker cannot move them out (setAppOverride, shell.js).
            //
            // The two halves may overlap — they will, as the five below
            // move into app/<name>/ and become intrinsic. renderAppGroup
            // draws one tile per id, so this list does not have to know
            // what is already in it.
            renderAppGroup(grid, ['app/stats', 'app/process-browser', 'app/jobs', 'app/apps', 'app/files', 'app/group-manager', 'app/contacts']
              .concat(spirit.shell.listIntrinsicApps()));
          },
        });

      })();
    </script>
  </body>
</html>
