<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpiritOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/js/kernel.js"></script>
    <style>
      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a2e;
        color: #eee;
      }

      #desktop {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 16px;
        padding: 24px;
        height: 100vh;
        align-content: start;
      }

      #desktop[hidden] { display: none; }

      /* Same grid the real desktop uses, scoped to a grouping app's own
         mount container (e.g. "spirit") rather than the full-viewport
         #desktop — no height:100vh, #app-content already provides padding. */
      .app-group-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 16px;
      }

      .app-icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 10px 4px;
        border-radius: 12px;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-icon:hover, .app-icon:active {
        background: rgba(255, 255, 255, 0.1);
      }

      .app-icon .icon { font-size: 40px; line-height: 1; }
      .app-icon .label { font-size: 13px; text-align: center; }

      #app-container {
        position: fixed;
        inset: 0;
        background: #16213e;
        overflow-y: auto;
      }

      #app-container[hidden] { display: none; }

      #app-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        position: sticky;
        top: 0;
        background: #0f3460;
        z-index: 1;
      }

      #app-close, #app-home, .titlebar-link {
        cursor: pointer;
        font-size: 22px;
        background: none;
        border: none;
        color: inherit;
        padding: 4px 8px;
      }

      #app-title { font-size: 16px; font-weight: 600; }
      #app-content { padding: 16px; }

      .titlebar-link {
        opacity: 0.75;
        margin-left: 8px;
        vertical-align: middle;
      }
      .titlebar-link:hover { opacity: 1; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }

      .stat-tile {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 12px;
      }

      .stat-tile.wide { grid-column: 1 / -1; }
      .stat-tile.clickable { cursor: pointer; }
      .stat-tile.clickable:hover { background: rgba(255, 255, 255, 0.12); }
      .stat-tile .value { font-size: 22px; font-weight: 700; }
      .stat-tile .label { font-size: 12px; opacity: 0.7; margin-top: 4px; }
      .stat-tile .rows { font-size: 13px; margin-top: 4px; }

      /* Label and value on the same line — dedicated to the file info
         bubble (renderFileInfoBubble), separate from .stat-tile .label/.rows
         above (stacked label-over-value), which other apps rely on as-is. */
      .file-info-row { display: flex; gap: 8px; font-size: 13px; margin-top: 4px; }
      .file-info-row .file-info-label { opacity: 0.7; min-width: 70px; }

      #file-tree summary {
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
      }

      #file-tree summary:hover { background: rgba(255, 255, 255, 0.08); }

      .tree-children { margin-left: 20px; }

      .file-row {
        cursor: pointer;
        padding: 4px 4px 4px 24px;
        border-radius: 6px;
      }

      .file-row:hover { background: rgba(255, 255, 255, 0.08); }

      #file-detail { margin-top: 16px; }

      .code-view {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 10px;
        padding: 12px;
        overflow-x: auto;
        white-space: pre;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        margin-top: 12px;
      }

      textarea.code-view { width: 100%; box-sizing: border-box; resize: vertical; color: inherit; border: none; }

      .media-view { max-width: 100%; margin-top: 12px; display: block; }

      #process-search {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 12px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
      }

      .process-entry {
        cursor: pointer;
        padding: 8px;
        border-radius: 8px;
      }

      .process-entry:hover { background: rgba(255, 255, 255, 0.08); }
      .process-entry-label { font-weight: 600; }
      .process-entry-desc { font-size: 12px; opacity: 0.75; margin-top: 2px; }

      .start-job-form {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .start-job-form input {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
      }

      .start-job-form button, .cancel-btn {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        background: #0f3460;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }

      .start-job-form button:hover, .cancel-btn:hover { background: #16487a; }

      #job-manifest-form {
        margin-top: 12px;
      }

      /* Same look as #job-manifest-form's fields, scoped by class instead
         of that one form's id, so other edit forms (e.g. the Apps table's
         per-app edit panel) can reuse it without duplicating the rules. */
      .field-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 0;
        font-size: 13px;
      }

      .field-label input {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
      }

      #job-manifest-form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 0;
        font-size: 13px;
      }

      #job-manifest-form input, #job-manifest-form select {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
        color-scheme: dark; /* tells the browser to render this select's native open-dropdown popup in dark chrome, not the OS default light one */
      }

      /* Belt-and-suspenders for browsers that don't fully honor color-scheme
         on the popup: most engines do respect explicit background/color on
         <option> itself. */
      #job-manifest-form select option {
        background: #16213e;
        color: #eee;
      }

      #job-manifest-form button {
        margin-top: 8px;
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        background: #0f3460;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }

      #job-manifest-form button:hover { background: #16487a; }

      .job-manifest-note { font-size: 12px; opacity: 0.75; margin-top: 8px; min-height: 1em; }

      .job-start-error {
        color: #ff8080;
        font-size: 13px;
        margin-bottom: 8px;
        min-height: 1em;
      }

      .jobs-table { width: 100%; border-collapse: collapse; font-size: 13px; }

      .jobs-table th, .jobs-table td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .job-row { cursor: pointer; }
      .job-row:hover { background: rgba(255, 255, 255, 0.06); }

      /* Fixed width + no wrap + ellipsis: a fast-changing last-log message
         must never change row height, or the whole table jiggles as it
         flips between wrapping and not. */
      .job-last-log { max-width: 300px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

      .job-log-row td { padding: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }

      .job-log-panel {
        background: rgba(0, 0, 0, 0.25);
        padding: 10px 14px;
        max-height: 240px;
        overflow-y: auto;
        font-size: 12px;
      }

      .job-log-entry { padding: 2px 0; }
      .job-log-time {
        opacity: 0.6;
        margin-right: 8px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .job-log-empty { opacity: 0.6; font-style: italic; }

      @media (max-width: 480px) {
        .app-icon .icon { font-size: 32px; }
        .app-icon .label { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <div id="desktop"></div>

    <div id="app-container" hidden>
      <div id="app-header">
        <button id="app-close" type="button" title="Back">⬅️</button>
        <button id="app-home" type="button" title="Home">🏠</button>
        <div id="app-title"></div>
      </div>
      <div id="app-content"></div>
    </div>

    <script src="/js/client/shell.js"></script>
    <script>
      (function () {
        var ICON = spirit.core.const.ICON;
        var registerApp = spirit.shell.registerApp;
        var launchApp = spirit.shell.launchApp;
        var escapeHtml = spirit.shell.escapeHtml;
        var renderOpenWith = spirit.shell.renderOpenWith;
        var findJobByType = spirit.shell.findJobByType;
        var mimeTypeForName = spirit.shell.mimeTypeForName;
        var classifyMimeType = spirit.shell.classifyMimeType;
        var iconForFile = spirit.shell.iconForFile;
        var CATEGORY_APP_HANDLERS = spirit.shell.CATEGORY_APP_HANDLERS;
        var setViewerTitle = spirit.shell.setViewerTitle;
        var renderFileInfoBubble = spirit.shell.renderFileInfoBubble;
        var renderAppGroup = spirit.shell.renderAppGroup;
        var listApps = spirit.shell.listApps;
        var getAppOverride = spirit.shell.getAppOverride;
        var setAppOverride = spirit.shell.setAppOverride;
        var fileInfoRow = spirit.shell.fileInfoRow;
        var listGroups = spirit.shell.listGroups;
        var createGroup = spirit.shell.createGroup;
        var updateGroup = spirit.shell.updateGroup;
        var deleteGroup = spirit.shell.deleteGroup;

        function formatUptime(seconds) {
          var total = Math.floor(seconds);
          var h = Math.floor(total / 3600);
          var m = Math.floor((total % 3600) / 60);
          var s = total % 60;
          return h + 'h ' + m + 'm ' + s + 's';
        }

        function tileHtml(value, label, wide, launchAppId) {
          var classes = 'stat-tile' + (wide ? ' wide' : '') + (launchAppId ? ' clickable' : '');
          var attr = launchAppId ? ' data-launch-app="' + launchAppId + '"' : '';
          return '<div class="' + classes + '"' + attr + '>' +
            '<div class="value">' + value + '</div>' +
            '<div class="label">' + label + '</div>' +
            '</div>';
        }

        function countsHtml(counts) {
          var keys = Object.keys(counts);
          if (keys.length === 0) return '<div class="rows">(none)</div>';
          return '<div class="rows">' + keys.map(function (k) {
            return k + ': ' + counts[k];
          }).join('<br>') + '</div>';
        }

        // ---- Stats app ----
        registerApp({
          id: 'stats',
          name: 'Stats',
          icon: ICON.CHART,
          hidden: true, // reachable via the "spirit" app group, or launchApp('stats') from anywhere
          mount: function (container, api, params) {
            container.innerHTML = '<div class="stats-grid" id="stats-grid"></div>';
            document.getElementById('stats-grid').addEventListener('click', function (event) {
              var tile = event.target.closest('[data-launch-app]');
              if (!tile) return;
              launchApp(tile.dataset.launchApp);
            });
          },
          render: function () {
            var grid = document.getElementById('stats-grid');
            if (!grid) return;

            var job = findJobByType('server-stats');
            if (!job || !job.data || !job.data.memory) {
              grid.innerHTML = tileHtml('…', 'waiting for stats', true);
              return;
            }

            var d = job.data;
            var html = '';
            html += tileHtml(spirit.core.util.formatBytes(d.memory.rss), 'Memory (RSS)');
            html += tileHtml(spirit.core.util.formatBytes(d.memory.heapUsed), 'Heap used');
            html += tileHtml(d.cpu.percent.toFixed(1) + '%', 'CPU');
            html += tileHtml(formatUptime(d.uptimeSeconds), 'Uptime');
            html += tileHtml(d.eventLoop.meanMs.toFixed(2) + ' ms', 'Event loop mean');
            html += tileHtml(d.eventLoop.maxMs.toFixed(2) + ' ms', 'Event loop max');
            html += tileHtml(d.eventLoop.p99Ms.toFixed(2) + ' ms', 'Event loop p99');
            html += tileHtml(d.filesystem.files, 'Files', false, 'files');
            html += tileHtml(d.filesystem.folders, 'Folders', false, 'files');
            html += tileHtml(d.sseConnections, 'SSE connections');
            html += tileHtml(d.requests.total, 'Requests total');

            var activeJobs = 0;
            Object.keys(d.jobs.byStatus).forEach(function (status) {
              if (TERMINAL_STATUSES.indexOf(status) === -1) activeJobs += d.jobs.byStatus[status];
            });
            html += tileHtml(activeJobs, 'Active jobs', false, 'jobs');

            html += '<div class="stat-tile wide clickable" data-launch-app="files"><div class="label">Files by MIME type</div>' +
              countsHtml(d.filesystem.byMimeType) + '</div>';
            html += '<div class="stat-tile wide"><div class="label">Requests by method</div>' +
              countsHtml(d.requests.byMethod) + '</div>';
            html += '<div class="stat-tile wide"><div class="label">Requests by status class</div>' +
              countsHtml(d.requests.byStatusClass) + '</div>';

            grid.innerHTML = html;
          },
        });

        // ---- Files app ----
        var lastFilesJob = null; // reference-equality cache — see mount()/render() below

        function buildTree(files) {
          var byPath = new Map();
          files.forEach(function (entry) { byPath.set(entry.fullPath, entry); });

          var roots = [];
          var childrenByPath = new Map();

          files.forEach(function (entry) {
            if (byPath.has(entry.parentPath)) {
              if (!childrenByPath.has(entry.parentPath)) childrenByPath.set(entry.parentPath, []);
              childrenByPath.get(entry.parentPath).push(entry);
            } else {
              roots.push(entry);
            }
          });

          return { roots: roots, childrenByPath: childrenByPath };
        }

        function renderTreeNode(entry, childrenByPath) {
          if (entry.kind === 'folder') {
            var kids = childrenByPath.get(entry.fullPath) || [];
            var kidsHtml = kids.map(function (k) { return renderTreeNode(k, childrenByPath); }).join('');
            return '<details open><summary>' + ICON.FOLDER + ' ' + escapeHtml(entry.name) + '</summary>' +
              '<div class="tree-children">' + kidsHtml + '</div></details>';
          }

          var mimeType = mimeTypeForName(entry.name);
          return '<div class="file-row" data-name="' + escapeHtml(entry.name) + '" data-path="' +
            escapeHtml(entry.relativePath) + '" data-mime="' + escapeHtml(mimeType) + '">' +
            iconForFile(mimeType) + ' ' + escapeHtml(entry.name) + '</div>';
        }

        function showFileDetail(name, path, mimeType) {
          var detailEl = document.getElementById('file-detail');
          if (!detailEl) return;
          detailEl.innerHTML = '<div class="stat-tile wide">' +
            '<div class="label">Name</div><div class="rows">' + escapeHtml(name) + '</div>' +
            '<div class="label">Path</div><div class="rows">' + escapeHtml(path) + '</div>' +
            '<div class="label">MIME type</div><div class="rows">' + escapeHtml(mimeType) + '</div>' +
            '</div>';
        }

        registerApp({
          id: 'files',
          name: 'Files',
          icon: ICON.FOLDER,
          mount: function (container, api, params) {
            // See the Processes app for why this must reset on every fresh
            // mount, not just persist: mount() always wipes the tree's DOM,
            // so a stale cache hit from a previous visit would leave it empty.
            lastFilesJob = null;

            container.innerHTML = '<div id="file-tree"></div><div id="file-detail"></div>';
            document.getElementById('file-tree').addEventListener('click', function (event) {
              var row = event.target.closest('.file-row');
              if (!row) return;
              var handlerId = CATEGORY_APP_HANDLERS[classifyMimeType(row.dataset.mime)];
              if (handlerId) {
                launchApp(handlerId, { path: row.dataset.path });
                return;
              }
              showFileDetail(row.dataset.name, row.dataset.path, row.dataset.mime);
            });
          },
          render: function () {
            var treeEl = document.getElementById('file-tree');
            if (!treeEl) return;

            var job = findJobByType('fs-watcher');
            if (job === lastFilesJob) return; // fs-watcher data unchanged (e.g. an unrelated stats tick) — leave the tree (and any collapsed folders) alone
            lastFilesJob = job;

            if (!job || !job.data || !Array.isArray(job.data.files)) {
              treeEl.textContent = 'waiting for file list…';
              return;
            }

            var tree = buildTree(job.data.files);
            treeEl.innerHTML = tree.roots.map(function (r) {
              return renderTreeNode(r, tree.childrenByPath);
            }).join('') || '(empty)';
          },
        });

        // ---- Code Viewer app ----
        // Only reachable via launchApp('code-viewer', { path }) from Files or
        // the Processes app — no desktop icon (hidden: true).
        // Cross-references a live LM Studio model list against the vision
        // probe's results.json (if it has ever been run), so the dropdown
        // can hide models that are KNOWN to fail rather than trusting a
        // model's own self-reported vision-capability claim. Untested models
        // (not yet probed, e.g. installed after the last run) still show —
        // only confirmed failures are excluded, so a genuinely new model
        // never gets hidden just because the probe hasn't seen it yet. If no
        // probe has ever run, this is a no-op: unfiltered, exactly today's
        // behavior.
        function classifyModelsAgainstProbe(liveIds) {
          var probeRaw = spirit.core.fs.loadFile('process/js/lmStudioVisionProbe/results.json');
          var resultByModel = {};
          var testedAt = null;
          if (probeRaw != null) {
            try {
              var probe = JSON.parse(probeRaw);
              testedAt = probe.testedAt || null;
              (probe.results || []).forEach(function (r) { resultByModel[r.model] = r; });
            } catch (e) { /* malformed/missing probe data — fall back to unfiltered */ }
          }
          var classified = liveIds
            .filter(function (id) {
              var r = resultByModel[id];
              return !r || r.success !== false; // only exclude CONFIRMED failures
            })
            .map(function (id) {
              var r = resultByModel[id];
              return {
                id: id,
                verified: !!(r && r.success === true),
                sizeBytes: r && r.sizeBytes != null ? r.sizeBytes : null,
                fitsInVram: r && r.fitsInVram != null ? r.fitsInVram : null,
              };
            });
          classified.sort(function (a, b) { return (b.verified ? 1 : 0) - (a.verified ? 1 : 0); });
          return { classified: classified, testedAt: testedAt };
        }

        function maybeRenderJobForm(container, scriptPath) {
          var match = scriptPath.match(/^process\/([^/]+)\/([^/]+)\/(.+)\.js$/);
          if (!match) return;

          var lang = match[1]; // 'js' -> node, anything else used as the literal command name
          var manifestPath = scriptPath.replace(/\.js$/, '.json');
          var manifestRaw = spirit.core.fs.loadFile(manifestPath);
          if (manifestRaw == null) return; // no manifest, no form — just a plain code view

          var manifest;
          try {
            manifest = JSON.parse(manifestRaw); // { label, description?, args: [{name, type, label, default}, ...] }
          } catch (e) {
            return;
          }

          var command = lang === 'js' ? 'node' : lang;

          var formEl = document.getElementById('job-manifest-form');
          var argsHtml = (manifest.args || []).map(function (arg) {
            if (arg.type === 'lm-studio-model' || arg.type === 'lm-studio-model-unloaded' || arg.type === 'lm-studio-model-loaded') {
              // Three flavors of the same dropdown, sharing the population
              // logic below: 'lm-studio-model' cross-references the vision
              // probe (for captioning-style scripts); 'unloaded'/'loaded'
              // filter by live state (for load/unload scripts — showing an
              // already-loaded model in the Load dropdown would let you
              // spawn a wasteful duplicate instance, confirmed live).
              // Rendered disabled with just the manifest default until the
              // live fetch below resolves — never blocks starting the job
              // on that fetch, since the default is already a valid value.
              var lmFilter = arg.type === 'lm-studio-model' ? 'vision' : (arg.type === 'lm-studio-model-unloaded' ? 'unloaded' : 'loaded');
              return '<label>' + escapeHtml(arg.label || arg.name) +
                '<select data-arg-name="' + escapeHtml(arg.name) + '" data-lm-studio-model-select data-lm-studio-filter="' + lmFilter + '" disabled>' +
                '<option value="' + escapeHtml(arg.default || '') + '">' + escapeHtml(arg.default || '(loading models…)') + '</option>' +
                '</select></label>';
            }
            var inputType = arg.type === 'number' ? 'number' : 'text';
            return '<label>' + escapeHtml(arg.label || arg.name) +
              '<input type="' + inputType + '" data-arg-name="' + escapeHtml(arg.name) +
              '" value="' + escapeHtml(arg.default != null ? arg.default : '') + '"></label>';
          }).join('');

          formEl.innerHTML = '<div class="stat-tile wide">' +
            '<h3>' + escapeHtml(manifest.label || scriptPath) + '</h3>' +
            argsHtml +
            '<button type="button" id="start-manifest-job">' + ICON.RUN + ' Start Job</button>' +
            '<div id="job-manifest-note" class="job-manifest-note"></div>' +
            '</div>';

          document.getElementById('start-manifest-job').addEventListener('click', function () {
            var values = {};
            formEl.querySelectorAll('[data-arg-name]').forEach(function (input) {
              values[input.dataset.argName] = input.type === 'number' ? Number(input.value) : input.value;
            });
            spirit.core.jobs.start({
              command: command,
              args: [scriptPath, JSON.stringify(values)],
              type: manifest.label || match[2],
            });
            launchApp('jobs'); // navigate immediately, don't wait on the request — the Jobs app picks up the new job live via SSE either way
          });

          // Populate any LM-Studio-model dropdowns live, without blocking the
          // rest of the form — if LM Studio isn't running, fall back to a
          // plain text input pre-filled with the manifest default rather
          // than leaving the field stuck disabled.
          formEl.querySelectorAll('[data-lm-studio-model-select]').forEach(function (select) {
            var argName = select.dataset.argName;
            var defaultValue = select.value;
            var filter = select.dataset.lmStudioFilter; // 'vision' | 'unloaded' | 'loaded'
            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, 2000);

            // Goes through our own server's generic /api/proxy route, not
            // LM Studio directly — LM Studio sends no Access-Control-Allow-
            // Origin header, so a cross-origin browser fetch to it would be
            // silently blocked by CORS even when it's perfectly reachable.
            // The proxy itself knows nothing about LM Studio — this caller
            // supplies the target and owns parsing LM Studio's raw response
            // shape. Load-state filtering needs LM Studio's native
            // /api/v0/models (the plain OpenAI-compatible /v1/models used
            // for the vision-probe case doesn't report `state` at all).
            var targetUrl = filter === 'vision' ? 'http://localhost:1234/v1/models' : 'http://localhost:1234/api/v0/models';

            fetch('/api/proxy', {
              method: 'POST',
              signal: controller.signal,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: targetUrl, timeoutMs: 2000 }),
            })
              .then(function (res) {
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error('proxy returned ' + res.status);
                return res.json();
              })
              .then(function (body) {
                var liveModels = body.data || [];
                if (liveModels.length === 0) throw new Error('no models currently loaded');

                if (filter === 'unloaded' || filter === 'loaded') {
                  var filtered = liveModels.filter(function (m) {
                    return filter === 'loaded' ? m.state === 'loaded' : m.state !== 'loaded';
                  });
                  if (filtered.length === 0) throw new Error('no ' + filter + ' models');
                  select.innerHTML = filtered.map(function (m) {
                    return '<option value="' + escapeHtml(m.id) + '"' + (m.id === defaultValue ? ' selected' : '') + '>' + escapeHtml(m.id) + '</option>';
                  }).join('');
                  select.disabled = false;
                  return;
                }

                var ids = liveModels.map(function (m) { return m.id; });
                var probeResult = classifyModelsAgainstProbe(ids);
                select.innerHTML = probeResult.classified.map(function (entry) {
                  var label = entry.id +
                    (entry.sizeBytes != null ? ' (' + spirit.core.util.formatBytes(entry.sizeBytes) + ')' : '') +
                    (entry.verified ? ' ' + ICON.OK : '') +
                    (entry.fitsInVram === false ? ' ' + ICON.WARNING : '');
                  return '<option value="' + escapeHtml(entry.id) + '"' + (entry.id === defaultValue ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
                }).join('');
                select.disabled = false;
                if (probeResult.testedAt) {
                  var probeNote = document.getElementById('job-manifest-note');
                  if (probeNote) probeNote.textContent = 'Filtered using vision-probe results from ' + new Date(probeResult.testedAt).toLocaleString() + '.';
                }
              })
              .catch(function () {
                clearTimeout(timeoutId);
                var fallback = document.createElement('input');
                fallback.type = 'text';
                fallback.dataset.argName = argName;
                fallback.value = defaultValue;
                fallback.title = 'LM Studio unreachable — enter the model id manually';
                select.replaceWith(fallback);
                var note = document.getElementById('job-manifest-note');
                if (note) note.textContent = 'LM Studio not reachable — enter the model id manually.';
              });
          });
        }

        // Shared by mount (first open) and loadFile (every later "Open with"
        // against a different file) — mount() itself only ever runs once
        // now that apps stay persistently mounted across navigation, so a
        // viewer that doesn't also implement loadFile would keep showing
        // whichever file it first opened, forever.
        function codeViewerLoadFile(path) {
          setViewerTitle(path);
          var content = spirit.core.fs.loadFile(path);
          document.getElementById('cv-body').innerHTML =
            renderFileInfoBubble(path) +
            '<div id="open-with"></div>' +
            '<div id="job-manifest-form"></div>' +
            '<pre class="code-view">' + escapeHtml(content == null ? '(could not load file)' : content) + '</pre>';
          renderOpenWith(document.getElementById('open-with'), 'code-viewer', path);
          maybeRenderJobForm(document.getElementById('cv-body'), path);
        }

        registerApp({
          id: 'code-viewer',
          name: 'Code Viewer',
          icon: ICON.CODE,
          hidden: true,
          mount: function (container, api, params) {

            codeViewerLoadFile(params.path);
          },
          loadFile: function (path) {
            codeViewerLoadFile(path);
          },
          render: function () {}, // static between loadFile calls — the file's content doesn't live-update
        });

        // ---- Media Viewer app (image/audio/video) ----
        var MEDIA_TAG_BY_CATEGORY = {
          image: { tag: 'img', extraAttrs: '' },
          audio: { tag: 'audio', extraAttrs: ' controls' },
          video: { tag: 'video', extraAttrs: ' controls' },

        // Same reasoning as codeViewerLoadFile, above.
        function mediaViewerLoadFile(path) {
          setViewerTitle(path);
          var category = classifyMimeType(mimeTypeForName(path));
          var tagInfo = MEDIA_TAG_BY_CATEGORY[category] || MEDIA_TAG_BY_CATEGORY.image;
          document.getElementById('mv-body').innerHTML =
            renderFileInfoBubble(path) +
            '<div id="open-with"></div>' +
            '<' + tagInfo.tag + ' class="media-view" src="/' + encodeURI(path) + '"' + tagInfo.extraAttrs + '></' + tagInfo.tag + '>';
          renderOpenWith(document.getElementById('open-with'), 'media-viewer', path);

        registerApp({
          id: 'media-viewer',
          name: 'Media Viewer',
          icon: ICON.VIEW,
          hidden: true,
          mount: function (container, api, params) {
            container.innerHTML = '<div id="mv-body"></div>';
            mediaViewerLoadFile(params.path);
          },
          loadFile: function (path) {
            mediaViewerLoadFile(path);
          },
          render: function () {},
        });

        // ---- Processes app ----
        var lastProcessBrowserJob = null;
        var lastProcessBrowserEntries = null; // cached {label, description, relativePath} list, independent of the search filter

        function renderProcessList() {
          var listEl = document.getElementById('process-browser-list');
          if (!listEl) return;

          if (!lastProcessBrowserEntries) {
            var job = lastProcessBrowserJob;
            if (!job || !job.data || !Array.isArray(job.data.files)) {
              listEl.textContent = 'waiting for file list…';
              return;
            }
            // A script's own file always shares its basename with its
            // enclosing folder (process/<lang>/<name>/<name>.<ext> — same
            // convention app/<name>/<name>.js already relies on), which
            // correctly excludes sibling assets living in the same folder
            // (a test fixture, an npm package.json, etc.) that the old
            // shape-only check let through. .json is still excluded
            // separately since a manifest shares that same basename.
            lastProcessBrowserEntries = job.data.files
              .filter(function (f) { return f.kind === 'file' && /^process\/[^/]+\/([^/]+)\/\1\.[^/.]+$/.test(f.relativePath) && !/\.json$/.test(f.relativePath); })
              .map(function (f) {
                var manifestRaw = spirit.core.fs.loadFile(f.relativePath.replace(/\.[^.]+$/, '.json'));
                var manifest = null;
                try { manifest = manifestRaw ? JSON.parse(manifestRaw) : null; } catch (e) {}
                return {
                  relativePath: f.relativePath,
                  label: (manifest && manifest.label) || f.name,
                  description: (manifest && manifest.description) || '',
                };
              });
          }

          var query = (document.getElementById('process-search').value || '').toLowerCase();
          var filtered = lastProcessBrowserEntries.filter(function (e) {
            return !query || e.label.toLowerCase().indexOf(query) !== -1 ||
              e.description.toLowerCase().indexOf(query) !== -1 ||
              e.relativePath.toLowerCase().indexOf(query) !== -1;
          });

          listEl.innerHTML = filtered.map(function (e) {
            return '<div class="process-entry" data-process-path="' + escapeHtml(e.relativePath) + '">' +
              '<div class="process-entry-label">' + escapeHtml(e.label) + '</div>' +
              (e.description ? '<div class="process-entry-desc">' + escapeHtml(e.description) + '</div>' : '') +
              '</div>';
          }).join('') || '(no matching processes)';
        }

        registerApp({
          id: 'process-browser',
          name: 'Processes',
          icon: ICON.ROCKET,
          hidden: true, // reachable via the "spirit" app group, or launchApp('process-browser') from anywhere
          mount: function (container, api, params) {
            // Force the next render() to actually populate the list — mount()
            // always wipes the DOM clean, so a cache hit from a previous visit
            // (same fs-watcher job reference, nothing changed on disk) must
            // not be allowed to skip repopulating a freshly-emptied container.
            lastProcessBrowserJob = null;
            lastProcessBrowserEntries = null;

            container.innerHTML =
              '<input type="text" id="process-search" placeholder="Search processes…">' +
              '<div id="process-browser-list"></div>';

            document.getElementById('process-search').addEventListener('input', function () {
              renderProcessList();
            });

            document.getElementById('process-browser-list').addEventListener('click', function (event) {
              var entry = event.target.closest('[data-process-path]');
              if (!entry) return;
              var mimeType = mimeTypeForName(entry.dataset.processPath);
              var handlerId = CATEGORY_APP_HANDLERS[classifyMimeType(mimeType)];
              if (!handlerId) {
                alert('No viewer registered yet for this file type (' + mimeType + ').');
                return;
              }
              launchApp(handlerId, { path: entry.dataset.processPath });
            });
          },
          render: function () {
            var job = findJobByType('fs-watcher');
            if (job === lastProcessBrowserJob) return; // fs-watcher data unchanged — skip re-scanning/re-fetching manifests
            lastProcessBrowserJob = job;
            lastProcessBrowserEntries = null;
            renderProcessList();
          },
        });

        // ---- Jobs app ----
        var TERMINAL_STATUSES = ['completed', 'failed', 'cancelled', 'stopped'];

        var STATUS_ICON = {
          pending: ICON.LOADING,
          running: ICON.RUN,
          completed: ICON.OK,
          failed: ICON.ERROR,
          cancelled: ICON.STOP,
          stopped: ICON.STOP,
          error: ICON.WARNING,
        };

        var expandedJobId = null; // the one job row currently expanded to show its full log, or null
        var currentJobsById = null; // same Map reference every render() call — cached so the expand/collapse click handler (in mount, no render args) can still re-render on demand

        function formatLogEntries(job) {
          if (!job.log || job.log.length === 0) return '<div class="job-log-empty">(no log entries yet)</div>';
          return job.log.map(function (entry) {
            return '<div class="job-log-entry"><span class="job-log-time">' +
              new Date(entry.timestamp).toLocaleTimeString() + '</span>' + escapeHtml(entry.message) + '</div>';
          }).join('');
        }

        function renderJobRow(job) {
          var icon = STATUS_ICON[job.status] || '';
          var lastLog = job.log && job.log.length ? job.log[job.log.length - 1].message : '';
          var isTerminal = TERMINAL_STATUSES.indexOf(job.status) !== -1;
          var canCancel = job.kind === 'process' && !isTerminal;
          var isExpanded = job.id === expandedJobId;

          var actionHtml = canCancel
            ? '<button type="button" class="cancel-btn" data-job-id="' + escapeHtml(job.id) + '">Cancel</button>'
            : (isTerminal
              ? '<button type="button" class="cancel-btn" data-delete-job-id="' + escapeHtml(job.id) + '">Delete</button>'
              : '');

          var mainRow = '<tr class="job-row" data-job-row="' + escapeHtml(job.id) + '">' +
            '<td>' + (isExpanded ? ICON.POINTDOWN : ICON.POINTRIGHT) + ' ' + icon + ' ' + escapeHtml(job.status) + '</td>' +
            '<td>' + escapeHtml(job.id) + '</td>' +
            '<td>' + escapeHtml(job.kind) + ' / ' + escapeHtml(job.type) + '</td>' +
            '<td>' + new Date(job.updatedAt).toLocaleTimeString() + '</td>' +
            '<td><div class="job-last-log">' + escapeHtml(lastLog) + '</div></td>' +
            '<td>' + actionHtml + '</td>' +
            '</tr>';

          if (!isExpanded) return mainRow;

          return mainRow + '<tr class="job-log-row"><td colspan="6"><div class="job-log-panel">' +
            formatLogEntries(job) + '</div></td></tr>';
        }

        // Leading + trailing throttle: a burst of rapid job-updated events
        // (e.g. a fast process logging hundreds of lines in ~1s) renders
        // instantly on the first change, then at most once/sec while the
        // burst continues, and always finishes with one render of the final
        // state. Manual expand/collapse clicks bypass this and call
        // renderJobsTable() directly, so toggling still feels instant.
        var JOBS_RENDER_THROTTLE_MS = 1000;
        var jobsRenderTimer = null;
        var jobsRenderPending = false;

        function throttledRenderJobsTable(jobsById) {
          if (jobsRenderTimer) { jobsRenderPending = true; return; }
          renderJobsTable(jobsById);
          jobsRenderTimer = setTimeout(function () {
            jobsRenderTimer = null;
            if (jobsRenderPending) {
              jobsRenderPending = false;
              renderJobsTable(jobsById);
            }
          }, JOBS_RENDER_THROTTLE_MS);
        }

        function renderJobsTable(jobsById) {
          var tbody = document.getElementById('jobs-tbody');
          if (!tbody) return;

          // Sticky scroll (same pattern as chat UIs): rebuilding tbody.innerHTML
          // destroys and recreates the log panel's DOM node, which would
          // otherwise silently reset its scroll position on every update —
          // exactly what made watching a live log fight the fs-watcher/
          // server-stats noise. Capture whether the panel was at (or near)
          // the bottom before rebuilding, then either pin it back to the new
          // bottom (so live-streaming logs stay watchable) or restore the
          // exact same scrollTop (so scrolling up to read history isn't
          // disturbed by unrelated updates). A freshly opened panel (no prior
          // panel to measure) defaults to pinned-to-bottom.
          var existingPanel = tbody.querySelector('.job-log-panel');
          var stickToBottom = true;
          var previousScrollTop = 0;
          if (existingPanel) {
            var distanceFromBottom = existingPanel.scrollHeight - existingPanel.scrollTop - existingPanel.clientHeight;
            stickToBottom = distanceFromBottom < 20; // small threshold for sub-pixel rounding
            previousScrollTop = existingPanel.scrollTop;
          }

          var rows = [];
          jobsById.forEach(function (job) { rows.push(job); });
          rows.sort(function (a, b) { return a.createdAt - b.createdAt; });

          tbody.innerHTML = rows.map(renderJobRow).join('') ||
            '<tr><td colspan="6">(no jobs)</td></tr>';

          var newPanel = tbody.querySelector('.job-log-panel');
          if (newPanel) {
            newPanel.scrollTop = stickToBottom ? newPanel.scrollHeight : previousScrollTop;
          }
        }

        registerApp({
          id: 'jobs',
          name: 'Jobs',
          icon: ICON.LIST,
          hidden: true, // reachable via the "spirit" app group, or launchApp('jobs') from anywhere
          mount: function (container, api, params) {
            expandedJobId = null; // fresh visit starts fully collapsed

            container.innerHTML =
              '<form id="start-job-form" class="start-job-form">' +
              '<input type="text" id="job-command" placeholder="command (e.g. node)" required>' +
              '<input type="text" id="job-args" placeholder="args (space-separated)">' +
              '<input type="text" id="job-type" placeholder="label (optional)">' +
              '<button type="submit">Start</button>' +
              '</form>' +
              '<div id="job-start-error" class="job-start-error"></div>' +
              '<table class="jobs-table"><thead><tr>' +
              '<th>Status</th><th>Id</th><th>Kind / Type</th><th>Updated</th><th>Last log</th><th></th>' +
              '</tr></thead><tbody id="jobs-tbody"></tbody></table>';

            document.getElementById('start-job-form').addEventListener('submit', function (event) {
              event.preventDefault();

              var command = document.getElementById('job-command').value.trim();
              var argsRaw = document.getElementById('job-args').value.trim();
              var type = document.getElementById('job-type').value.trim();
              var args = argsRaw ? argsRaw.split(/\s+/) : [];
              var errorEl = document.getElementById('job-start-error');
              errorEl.textContent = '';

              spirit.core.jobs.start({ command: command, args: args, type: type || undefined })
                .then(function () {
                  document.getElementById('start-job-form').reset();
                })
                .catch(function (err) {
                  errorEl.textContent = 'Failed to start job: ' + err.message;
                });
            });

            document.getElementById('jobs-tbody').addEventListener('click', function (event) {
              var cancelBtn = event.target.closest('[data-job-id]');
              if (cancelBtn) {
                spirit.core.jobs.cancel(cancelBtn.dataset.jobId).catch(function (err) {
                  console.error('cancel failed', err);
                });
                return;
              }

              var deleteBtn = event.target.closest('[data-delete-job-id]');
              if (deleteBtn) {
                spirit.core.jobs.delete(deleteBtn.dataset.deleteJobId).catch(function (err) {
                  console.error('delete failed', err);
                });
                return;
              }

              var row = event.target.closest('[data-job-row]');
              if (row) {
                var jobId = row.dataset.jobRow;
                expandedJobId = (expandedJobId === jobId) ? null : jobId; // opening one closes any other
                renderJobsTable(currentJobsById); // re-render immediately — don't wait for the next live update to reflect the toggle
              }
            });
          },
          render: function (jobsById) {
            currentJobsById = jobsById;
            throttledRenderJobsTable(jobsById);
          },
        });

        // ---- Apps list ----
        // Lists every registered app (built-in + already-discovered
        // dynamic apps) via listApps(), visually similar to the Jobs
        // table — including the same click-a-row-to-expand pattern
        // (expandedAppId mirrors Jobs' own expandedJobId). The expanded
        // panel is the actual edit surface for appOverrides: currently
        // just the name property (the only one built so far); more
        // properties (icon next) will grow this same panel rather than
        // each getting a separate screen.
        var expandedAppId = null;

        function locationLabel(a, groupsById) {
          if (!a.group) return 'Desktop';
          if (a.group === 'none') return 'None';
          var g = groupsById[a.group];
          return g ? g.name : a.group; // fallen-out-of-sync fallback — shouldn't happen, setAppOverride validates on write
        }

        function renderAppManagerRow(a, groupsById, groupList) {
          var isExpanded = a.id === expandedAppId;
          var mainRow = '<tr class="job-row" data-app-row="' + escapeHtml(a.id) + '">' +
            '<td>' + (isExpanded ? ICON.POINTDOWN : ICON.POINTRIGHT) + ' ' + escapeHtml(a.icon) + '</td>' +
            '<td>' + escapeHtml(a.name) + '</td>' +
            '<td>' + escapeHtml(a.id) + '</td>' +
            '<td>' + escapeHtml(locationLabel(a, groupsById)) + '</td>' +
            '<td>' + (a.dynamic ? 'Dynamic' : 'Built-in') + '</td>' +
            '</tr>';

          if (!isExpanded) return mainRow;

          var override = getAppOverride(a.id);
          // Renaming is locked for built-in shell utilities (see
          // setAppOverride's own comment, shell.js) — a written doc or
          // support note referring to "the Jobs app" should always match
          // what's actually on screen. Dynamically-loaded apps (AI Chat,
          // Text Editor, anything installed later) aren't called out by a
          // fixed name in core docs the same way, so they stay renameable.
          // Saves on change (fires on blur/Enter, not per keystroke) rather
          // than requiring an explicit Save click — one less click, and
          // still compatible with the focus-guard in renderAppManagerTable
          // above, since the input has already blurred by the time change
          // fires. Clearing the field to empty and blurring is equivalent
          // to "Reset to default" (setAppOverride treats '' as "clear this
          // property"); the explicit button stays too, as a one-click
          // shortcut over select-all-and-delete.
          var nameFieldHtml = a.dynamic
            ? '<label class="field-label">Custom name' +
              '<input type="text" id="app-manager-name-input" data-app-id="' + escapeHtml(a.id) + '" value="' + escapeHtml(override.name || '') + '" placeholder="' + escapeHtml(a.defaultName) + '"></label>' +
              (override.name ? '<button type="button" class="cancel-btn" data-reset-app-name="' + escapeHtml(a.id) + '">Reset to default</button>' : '')
            : '<div class="job-manifest-note">Built-in shell utility — name isn\'t customizable, to keep documentation and support consistent.</div>';
          // Not locked to dynamic apps the way name is — see
          // setAppOverride's comment (shell.js) for why icon doesn't carry
          // the same documentation-drift risk.
          var iconFieldHtml = '<label class="field-label">Custom icon (paste any emoji)' +
            '<input type="text" id="app-manager-icon-input" data-app-id="' + escapeHtml(a.id) + '" value="' + escapeHtml(override.icon || '') + '" placeholder="' + escapeHtml(a.defaultIcon) + '"></label>' +
            (override.icon ? '<button type="button" class="cancel-btn" data-reset-app-icon="' + escapeHtml(a.id) + '">Reset to default</button>' : '');
          // Locked to dynamic apps only, unlike icon — built-in apps' place
          // in the shell is curated by code (Spirit's own fixed member
          // list); groups exist to organize the open-ended, growing set of
          // installed apps, not to override that curation. No collision
          // check (any number of apps may share a group, or all be
          // "none"). "" selects Desktop, which clears the override back to
          // the default, same convention as clearing name/icon.
          var groupFieldHtml = a.dynamic
            ? '<label class="field-label">Location' +
              '<select id="app-manager-group-input" data-app-id="' + escapeHtml(a.id) + '">' +
                '<option value=""' + (!a.group ? ' selected' : '') + '>Desktop</option>' +
                groupList.map(function (g) {
                  return '<option value="' + escapeHtml(g.id) + '"' + (a.group === g.id ? ' selected' : '') + '>' + escapeHtml(g.name) + '</option>';
                }).join('') +
                '<option value="none"' + (a.group === 'none' ? ' selected' : '') + '>None</option>' +
              '</select></label>'
            : '';
          var detailHtml = '<div class="stat-tile wide">' +
            fileInfoRow('Id', escapeHtml(a.id)) +
            fileInfoRow('Default name', escapeHtml(a.defaultName)) +
            fileInfoRow('Default icon', escapeHtml(a.defaultIcon)) +
            fileInfoRow('Source', a.dynamic ? 'Dynamic (script loads on first launch)' : 'Built-in') +
            nameFieldHtml +
            iconFieldHtml +
            groupFieldHtml +
            '</div>';

          // No .job-log-panel wrapper here, unlike Jobs' own expand panel —
          // that class's max-height/overflow-y:auto is right for Jobs'
          // genuinely unbounded, ever-growing log, but wrong for this
          // panel's small, fixed set of fields: it clipped to a scrollbar
          // once the icon/visibility fields were added, and the periodic
          // re-render (every job-updated tick) recreated that scrollable
          // div fresh each time, visibly resetting its scroll position
          // every ~2s. detailHtml's own .stat-tile wide already provides
          // background/padding, so nothing else is needed here.
          return mainRow + '<tr class="job-log-row"><td colspan="5">' + detailHtml + '</td></tr>';
        }

        function renderAppManagerTable(force) {
          var tbody = document.getElementById('app-manager-tbody');
          if (!tbody) return;
          // Skip rebuilding while a name/icon/location field is focused,
          // UNLESS force is set. render() fires on every job-updated tick
          // (server-stats alone is ~every 2s, regardless of user action),
          // and a full tbody.innerHTML rebuild destroys and recreates those
          // fields each time — kicking focus out from under anyone mid-edit
          // before they can act, confirmed live twice now: first via
          // matching renderActive/focusout timestamps for the text inputs,
          // then live again for the group <select> specifically — an open
          // native dropdown counts as "focused" too, and was being
          // collapsed out from under a selection in progress before this
          // was added to the same guard. force:true is for the opposite
          // case — a real user action (change/reset/row-toggle) that must
          // always take effect immediately, even if document.activeElement's
          // transition away from the field hasn't fully settled yet.
          var focusedId = document.activeElement && document.activeElement.id;
          if (!force && (focusedId === 'app-manager-name-input' || focusedId === 'app-manager-icon-input' || focusedId === 'app-manager-group-input')) return;
          var groupList = listGroups();
          var groupsById = {};
          groupList.forEach(function (g) { groupsById[g.id] = g; });
          var rows = listApps().sort(function (a, b) { return a.name.localeCompare(b.name); });
          tbody.innerHTML = rows.map(function (a) { return renderAppManagerRow(a, groupsById, groupList); }).join('') || '<tr><td colspan="5">(no apps registered)</td></tr>';
        }

        registerApp({
          id: 'app-manager',
          name: 'Apps',
          icon: ICON.TABLE,
          hidden: true, // reachable via the "spirit" app group
          mount: function (container, api, params) {
            expandedAppId = null; // fresh visit starts fully collapsed

            container.innerHTML =
              '<table class="jobs-table"><thead><tr>' +
              '<th></th><th>Name</th><th>Id</th><th>Location</th><th>Source</th>' +
              '</tr></thead><tbody id="app-manager-tbody"></tbody></table>';

            document.getElementById('app-manager-tbody').addEventListener('click', function (event) {
              var resetNameBtn = event.target.closest('[data-reset-app-name]');
              if (resetNameBtn) {
                setAppOverride(resetNameBtn.dataset.resetAppName, { name: '' });
                renderAppManagerTable(true);
                return;
              }

              var resetIconBtn = event.target.closest('[data-reset-app-icon]');
              if (resetIconBtn) {
                setAppOverride(resetIconBtn.dataset.resetAppIcon, { icon: '' });
                renderAppManagerTable(true);
                return;
              }

              var row = event.target.closest('[data-app-row]');
              if (row) {
                var id = row.dataset.appRow;
                expandedAppId = (expandedAppId === id) ? null : id; // opening one closes any other
                renderAppManagerTable(true); // re-render immediately — don't wait for the next live update
              }
            });

            // Saves on change rather than requiring an explicit Save click
            // — change fires on blur/Enter. force:true here since this IS
            // the user finishing their edit; it must show up right away
            // regardless of exactly where focus has landed by this point.
            document.getElementById('app-manager-tbody').addEventListener('change', function (event) {
              var isName = event.target.id === 'app-manager-name-input';
              var isIcon = event.target.id === 'app-manager-icon-input';
              var isGroup = event.target.id === 'app-manager-group-input';
              if (!isName && !isIcon && !isGroup) return;

              var patch = isName ? { name: event.target.value.trim() }
                : isIcon ? { icon: event.target.value.trim() }
                : { group: event.target.value };
              var result = setAppOverride(event.target.dataset.appId, patch);
              if (!result.ok) {
                var messages = {
                  'name-collision': 'Another app is already showing that name — pick a different one.',
                  'icon-collision': 'Another app is already using that icon — pick a different one.',
                };
                alert(messages[result.reason] || ('Could not update this app: ' + result.reason));
              }
              renderAppManagerTable(true);
            });
          },
          render: function () {
            renderAppManagerTable();
          },
        });

        // ---- Groups app ----
        // Manages user-created top-level app groups: create one, rename/
        // re-icon an existing one, or delete one (its members revert to
        // the Desktop, not orphaned — confirmed before deleting anything
        // with a member, since that's the one destructive step here).
        // Placement of individual apps into a group happens in the Apps
        // table (its Location dropdown), not here — this screen manages
        // the groups themselves, not membership.
        var expandedGroupId = null;

        function renderGroupManagerRow(g) {
          var isExpanded = g.id === expandedGroupId;
          var mainRow = '<tr class="job-row" data-group-row="' + escapeHtml(g.id) + '">' +
            '<td>' + (isExpanded ? ICON.POINTDOWN : ICON.POINTRIGHT) + ' ' + escapeHtml(g.icon) + '</td>' +
            '<td>' + escapeHtml(g.name) + '</td>' +
            '<td>' + g.memberCount + '</td>' +
            '</tr>';

          if (!isExpanded) return mainRow;

          var detailHtml = '<div class="stat-tile wide">' +
            fileInfoRow('Id', escapeHtml(g.id)) +
            fileInfoRow('Members', g.memberCount === 0 ? '(none — see the warning panel on the group itself)' : g.memberIds.map(escapeHtml).join(', ')) +
            '<label class="field-label">Name<input type="text" id="group-manager-name-input" data-group-id="' + escapeHtml(g.id) + '" value="' + escapeHtml(g.name) + '"></label>' +
            '<label class="field-label">Icon<input type="text" id="group-manager-icon-input" data-group-id="' + escapeHtml(g.id) + '" value="' + escapeHtml(g.icon) + '"></label>' +
            '<button type="button" class="cancel-btn" data-delete-group="' + escapeHtml(g.id) + '">Delete group</button>' +
            '</div>';

          return mainRow + '<tr class="job-log-row"><td colspan="3">' + detailHtml + '</td></tr>';
        }

        function renderGroupManagerTable(force) {
          var tbody = document.getElementById('group-manager-tbody');
          if (!tbody) return;
          // Same focus-preserving guard as the Apps table, same reason —
          // render() fires on every job-updated tick regardless of user
          // action, and would otherwise destroy a focused rename input.
          var focusedId = document.activeElement && document.activeElement.id;
          if (!force && (focusedId === 'group-manager-name-input' || focusedId === 'group-manager-icon-input')) return;
          var groups = listGroups().sort(function (a, b) { return a.name.localeCompare(b.name); });
          tbody.innerHTML = groups.map(renderGroupManagerRow).join('') || '<tr><td colspan="3">(no groups yet)</td></tr>';
        }

        registerApp({
          id: 'group-manager',
          name: 'Groups',
          icon: ICON.GROUP,
          hidden: true, // reachable via the "spirit" app group
          mount: function (container, api, params) {
            expandedGroupId = null; // fresh visit starts fully collapsed

            container.innerHTML =
              '<div class="stat-tile wide">' +
                '<label class="field-label">New group name<input type="text" id="group-manager-new-name" placeholder="e.g. Media Tools"></label>' +
                '<label class="field-label">New group icon (paste any emoji)<input type="text" id="group-manager-new-icon" placeholder="e.g. 🎨"></label>' +
                '<button type="button" class="cancel-btn" id="group-manager-create">Create group</button>' +
                '<div id="group-manager-create-error" class="job-start-error"></div>' +
              '</div>' +
              '<table class="jobs-table"><thead><tr><th></th><th>Name</th><th>Members</th></tr></thead><tbody id="group-manager-tbody"></tbody></table>';

            document.getElementById('group-manager-create').addEventListener('click', function () {
              var nameInput = document.getElementById('group-manager-new-name');
              var iconInput = document.getElementById('group-manager-new-icon');
              var errorEl = document.getElementById('group-manager-create-error');
              var result = createGroup(nameInput.value.trim(), iconInput.value.trim());
              if (!result.ok) {
                var messages = {
                  'name-and-icon-required': 'Both a name and an icon are required.',
                  'name-collision': 'Another app or group is already using that name.',
                  'icon-collision': 'Another app or group is already using that icon.',
                };
                errorEl.textContent = messages[result.reason] || ('Could not create group: ' + result.reason);
                return;
              }
              errorEl.textContent = '';
              nameInput.value = '';
              iconInput.value = '';
              renderGroupManagerTable(true);
            });

            document.getElementById('group-manager-tbody').addEventListener('click', function (event) {
              var deleteBtn = event.target.closest('[data-delete-group]');
              if (deleteBtn) {
                var id = deleteBtn.dataset.deleteGroup;
                var group = listGroups().filter(function (g) { return g.id === id; })[0];
                var memberCount = group ? group.memberCount : 0;
                var name = group ? group.name : id;
                if (!confirm('Delete "' + name + '"? ' + memberCount + ' app(s) will move back to the desktop.')) return;
                deleteGroup(id);
                expandedGroupId = null;
                renderGroupManagerTable(true);
                return;
              }

              var row = event.target.closest('[data-group-row]');
              if (row) {
                var rowId = row.dataset.groupRow;
                expandedGroupId = (expandedGroupId === rowId) ? null : rowId; // opening one closes any other
                renderGroupManagerTable(true);
              }
            });

            document.getElementById('group-manager-tbody').addEventListener('change', function (event) {
              var isName = event.target.id === 'group-manager-name-input';
              var isIcon = event.target.id === 'group-manager-icon-input';
              if (!isName && !isIcon) return;

              var patch = isName ? { name: event.target.value.trim() } : { icon: event.target.value.trim() };
              var result = updateGroup(event.target.dataset.groupId, patch);
              if (!result.ok) {
                var messages = {
                  'name-required': 'Name cannot be empty.',
                  'icon-required': 'Icon cannot be empty.',
                  'name-collision': 'Another app or group is already using that name.',
                  'icon-collision': 'Another app or group is already using that icon.',
                };
                alert(messages[result.reason] || ('Could not update group: ' + result.reason));
              }
              renderGroupManagerTable(true);
            });
          },
          render: function () {
            renderGroupManagerTable();
          },
        });

        // ---- Spirit app (launcher/grouping template) ----
        // Hosts a sub-view of the machine-introspection apps (Stats,
        // Processes, Jobs, Apps, Groups) — hidden from the real desktop
        // below — using the same reusable icon-grid template user-created
        // groups also build on (registerGroupApp, shell.js). Files stays a
        // front-page icon: it's a content-facing app you use, not a
        // system-introspection tool.
        registerApp({
          id: 'spirit',
          name: 'Spirit',
          icon: ICON.SPIRIT,
          mount: function (container, api, params) {
            container.innerHTML = '<div class="app-group-grid" id="spirit-group"></div>';
          },
          render: function () {
            var grid = document.getElementById('spirit-group');
            if (!grid) return;
            renderAppGroup(grid, ['stats', 'process-browser', 'jobs', 'app-manager', 'group-manager']);
          },
        });

      })();
    </script>
  </body>
</html>
