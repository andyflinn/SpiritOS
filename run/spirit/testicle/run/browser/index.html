<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>testicle in the browser</title>
<script src="/spirit/script.js"></script>
</head>
<body>
<!-- goal/G50.1: the browser side of testicle. Its address names the tests after the #, as { tests, limit }; each runs
     through spirit/testicle/runTest/script.js, the same file node uses, and the rows land in #rows for whoever drives
     the page (run/browser/script.js reads them back). -->
<pre id="rows"></pre>
<script>
(function () {
  var out = document.getElementById('rows');
  var asked = {};
  try { asked = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) { asked = {}; }
  var list = Array.isArray(asked.tests) ? asked.tests : [];
  function subjectOf(t) { var p = t.split('/'); return p.slice(0, -3).join('/') + '/script.js'; }
  spirit.requireScript('spirit/testicle/runTest/script.js').then(function (runTest) {
    var rows = {};
    return list.reduce(function (p, t) {
      return p.then(function () { return runTest(t, subjectOf(t), asked.limit).then(function (r) { rows[t] = r; }); });
    }, Promise.resolve()).then(function () { out.textContent = JSON.stringify(rows); });
  }, function (e) { out.textContent = JSON.stringify({ error: String(e && e.message || e) }); });
}());
</script>
</body>
</html>
