<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>labMaster</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.35rem 0.5rem; text-align: left; }
    .row-actions button { margin-right: 0.25rem; }
    /* Below the table, and able to hold several lines. */
    #status { margin: 1rem 0 0; min-height: 1.2em; white-space: pre-wrap; font-family: monospace; }
    /* An armed Delete says so in colour as well as words: the label
       changes, and a person scanning a table of eight rows needs to see
       WHICH one is loaded without reading them. */
    button.armed { background: #7a2020; color: #fff; }
    .row-error { color: #ff8080; }
    label { margin-right: 0.75rem; }
    .bulk { margin: 0.75rem 0; }
  </style>
</head>
<body>
  <h1>labMaster</h1>
  <p>Fixed bookmark: <code>http://127.0.0.1:65420</code>. Work node is port 65432 and cannot be deleted.</p>
  <!-- RESTART LABMASTER (goal/G43.29; Andy: "could it have a "restart-labmaster
       button? that works both on linux AND windows?"): labMaster starts a fresh
       copy of itself and goes; every node stays up, and this page's poll finds
       the new one by itself. -->
  <div class="bulk">
    <button type="button" id="restart-master">Restart labMaster</button>
    <small>picks up a pulled labMaster; every node keeps running.</small>
  </div>
  <table>
    <thead>
      <tr>
        <!-- RUNNING WENT WITH THE TWO BUTTONS.

               Andy: "either start or stop (which kind of makes the
               'running' column irrelevant)."

             One button that says Stop IS the running column, and a
             column repeating what the control beside it already shows is
             a column read on every pass to learn nothing. -->
        <th>Name</th><th>Type</th><th>Port</th><th>Commit</th><th>Home</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="status"></div>
  <script>
    // ── AN ARMED DELETE GOES COLD IF YOU LOOK AWAY ───────────────────
    //
    //   Andy: "a delete button with are-you-sure" — and the standing rule
    //   from UI_DESIGN_STYLE.md: "whenever i click anywhere else on the
    //   screen the button must reset, back to its original state, and the
    //   whole are-you-sure procedure must be done from scratch."
    //
    // The danger is not the second press: it is the press AFTER it.
    // Somebody arms Delete on jazz, gets distracted, comes back and
    // presses — and the confirmation goes to a question they have
    // forgotten being asked, on a node that holds a key.
    //
    // THIS PAGE IS NOT A SHELL APP, so api.armUntilElsewhere is not
    // available and the same discipline is kept by hand. Two listeners,
    // for the reason the shell needs two: the click that ARMS the button
    // is itself a click, so a single "disarm on any click" would disarm
    // in the same gesture that armed it. The capture listener stamps
    // which event is being handled; the bubble listener disarms only if
    // the arming did not happen during THIS event.
    //
    // AND A REPAINT MUST NOT ARM ANYTHING. The table redraws every three
    // seconds, so the armed id is deliberately the ONLY thing outside the
    // server's answer that the row is drawn from.
    //
    // ONE ARMED BUTTON AT A TIME, Delete or Stop: armed is '<act>:<id>'
    // (goal/G43.29; Andy: "give me a stop-button with are-you-sure.....").
    var armed = '';
    var armedEvent = null;
    var currentClick = null;

    document.addEventListener('click', function (ev) { currentClick = ev; }, true);
    document.addEventListener('click', function (ev) {
      if (!armed || armedEvent === ev) return;
      armed = '';
      armedEvent = null;
      // REPAINTED HERE AND NOW, from what is already on screen. Calling
      // refresh() alone would leave the button hot until a fetch came
      // back — and not at all if the network were down, which is exactly
      // when somebody is clicking around wondering what is wrong.
      render(lastRows);
    }, false);

    var statusEl = document.getElementById('status');
    function setStatus(t) { statusEl.textContent = t; }

    function api(method, path, body) {
      var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      return fetch(path, opts).then(function (r) {
        return r.text().then(function (t) {
          var parsed;
          try { parsed = t ? JSON.parse(t) : {}; } catch (e) { parsed = { raw: t }; }
          return { status: r.status, body: parsed };
        });
      });
    }

    function render(nodes) {
      // WHAT IS ON SCREEN, remembered by the thing that put it there.
      //
      // `lastRows` was set by refresh() alone, and arming Delete
      // repaints from it — so a press before the first poll answered, or
      // after one failed, would have redrawn the table from an empty
      // list and blanked it. Recording here means a repaint can always
      // draw what is already there, whatever the network is doing.
      if (nodes) lastRows = nodes;
      var tbody = document.getElementById('tbody');
      tbody.innerHTML = nodes.map(function (n) {
        // ── THREE BUTTONS, AND NO MORE ───────────────────────────────
        //
        //   Andy: "can i only have 3 buttons per peer 1) either start or
        //   stop 2) update, which should always be a git.update plus
        //   (re)start. and a delete button with are-you-sure."
        //
        // RECYCLE IS GONE FROM THE PANEL. It wiped the home and cloned a
        // fresh one — the button behind the complaint that started all of
        // this, sitting one pixel from Update and reading as a synonym
        // for it. Delete and Create is the same outcome and says what it
        // does, so nothing is lost but the trap.
        //
        // The VERB stays on the server: labWorld calls recycle when it
        // finds a row already in the table, which is how a suite asks for
        // a node it can trust to be new.
        //
        // ONE BUTTON, NOT A TOGGLE.
        //
        //   Andy: "labMaster no longer offers me start or stop, one
        //   (re)start button would do."
        //
        // A toggle shows you one half of itself, so with every node up
        // every row said Stop and the column read as though it had lost a
        // control. And the thing wanted most often — put this node back on
        // its feet — took two presses with a wait in between.
        //
        // (Re)start stops it if it is up and starts it either way, so the
        // button means the same thing on every row whatever the row is
        // doing. WHETHER A NODE IS UP is still on the screen: a running
        // node's name is a link to it, a stopped one's is plain text.
        //
        // STOP CAME BACK, ARMED (goal/G43.29; Andy: "give me a stop-button
        // with are-you-sure....."): on every row, the work node's too, two
        // presses as Delete takes, the same stop verb labWorld calls
        // between suites.
        //
        // THE WORK NODE GETS THIS ONE AND ONLY THIS ONE. It is Andy's own
        // checkout, so Update would fetch and hard-reset the tree he is
        // writing in and Delete would take it off the disk — both refused
        // on the server, and neither drawn here. But restarting it is the
        // commonest thing he does to it, and every node-side fix needs a
        // node restart to be true, so it had no business being a trip to
        // the terminal.
        //
        // stopNode kills whatever holds the port, not just a child it
        // spawned, so this works on a work node started from a terminal.
        // After that its process belongs to labMaster — and labMaster's
        // exit handler skips permanent nodes on purpose, so quitting the
        // panel does not take the checkout down with it.
        var restart = '<button data-act="restart" data-id="' + n.id + '" ' +
          'title="Stop it if it is up, then start it on its port. ' +
          'No fetch \\u2014 same code it is running now.">(Re)start</button>';
        var stop = '<button data-act="stop" data-id="' + n.id + '"' +
          (armed === 'stop:' + n.id ? ' class="armed"' : '') + '>' +
          (armed === 'stop:' + n.id ? 'Really stop?' : 'Stop') + '</button>';

        var actions = n.permanent
          ? restart + stop
          : restart + stop +
            '<button data-act="refresh" data-id="' + n.id + '" ' +
              'title="git fetch + reset --hard origin/master, then start it. ' +
              'Same node, same key, same relay rows \u2014 git never had them.">' +
              'Update</button>' +
            // TWO PRESSES, and it goes cold if you look away — the rule
            // in UI_DESIGN_STYLE.md. This page is not a shell app, so it
            // cannot use api.armUntilElsewhere and keeps the same
            // discipline by hand below.
            '<button data-act="delete" data-id="' + n.id + '"' +
              (armed === 'delete:' + n.id ? ' class="armed"' : '') + '>' +
              (armed === 'delete:' + n.id ? 'Really delete?' : 'Delete') + '</button>';

            // WHAT WENT WRONG rides the name now that the Running column
            // is gone. It was the only other thing in that cell, and it is
            // the one thing on a row that must not be dropped quietly: a
            // node that refused to start with nothing said looks exactly
            // like one nobody has started.
            var label = n.name + (n.permanent ? ' <small>permanent</small>' : '') +
              (n.lastError ? ' <small class="row-error">' + n.lastError + '</small>' : '');
            var nameCell = n.running
            ? '<a href="http://127.0.0.1:' + n.port + '" target="_blank" rel="noopener">' + label + '</a>'
            : label;
        // Six cells for six headings. Count them against the <th>
        // row above before adding one: an earlier version drew `label`
        // twice and every column after it sat under the wrong heading.
        // THE CONNECTED TO COLUMN IS GONE (goal/G43.29; Andy: "get rid of
        // the connected to column"), and the /api/links route it drew from.
        return '<tr>' +
          '<td>' + nameCell + '</td>' +
          '<td>' + n.type + '</td>' +
          '<td>' + n.port + '</td>' +
          // WHICH COMMIT IT IS ON, which only became a real question when
          // lab nodes started running published code rather than a copy
          // of the checkout. '—' for the work node, which is the checkout
          // and answers for itself in the terminal.
          '<td><small>' + (n.commit || '\u2014') + '</small></td>' +
          '<td><small>' + n.home + '</small></td>' +
          // A HARDCODED Start AND Stop STOOD HERE, beside the pair that
          // `actions` builds — so a row drew five buttons: Start, Stop,
          // and then the toggle, Update and Delete (Andy: "whoops! my
          // avatars have 5 buttons now").
          //
          // Everything a row offers is built in one place now, which is
          // what makes "three buttons" a thing that can be counted.
          '<td class="row-actions">' + actions + '</td></tr>';
      }).join('');
    }

    // The last thing drawn, so arming Delete can repaint without a round
    // trip — and so the three-second poll and a button press draw from
    // the same thing. Written by render(), not by the fetch: see there.
    var lastRows = [];

    function refresh() {
      return api('GET', '/api/nodes').then(function (r) {
        var rows = (r.body && r.body.nodes) || [];
        render(rows);
      }).catch(function (e) { setStatus('refresh failed: ' + e.message); });
    }

    // THE LIVE WORLD. Sequential by nature — it mints, claims, restarts and
    // waits for a stream — so the button disables itself and reports each
    // step as the server did it rather than pretending to be instant.
    //
    // Every line it prints is something that happened, in order. A failure
    // stops at the step that failed and says which, because "it did not
    // work" is the least useful thing a control plane can tell you.
    // RESTART LABMASTER: one press, nothing is lost by it. The answer comes
    // before it goes; the three-second poll then reaches the new one, and a
    // poll that fails meanwhile only says so in the status line.
    document.getElementById('restart-master').addEventListener('click', function () {
      setStatus('restarting labMaster…');
      api('POST', '/api/restart-master', {}).then(function () {
        setStatus('labMaster restarting: this page reconnects by itself');
      }, function (e) { setStatus('restart failed: ' + e.message); });
    });

    document.getElementById('tbody').addEventListener('click', function (e) {
      var act = e.target.getAttribute('data-act');
      var id = e.target.getAttribute('data-id');
      if (!act || !id) return;

      // ── DELETE ASKS FIRST ────────────────────────────────────────────
      //
      // The home goes with the row, and for a lab node the home holds a
      // key that may have a seat on a public relay. One press is not
      // enough for that, and the arming is recorded so the listeners
      // above can take it back the moment attention moves.
      // STOP ASKS FIRST TOO (Andy: "give me a stop-button with
      // are-you-sure....."), by the same arming.
      if ((act === 'delete' || act === 'stop') && armed !== act + ':' + id) {
        armed = act + ':' + id;
        armedEvent = currentClick;
        setStatus(act === 'delete' ? 'delete ' + id + ': press again to confirm — its home and key go with it'
          : 'stop ' + id + ': press again to confirm — it stays down until (Re)start');
        render(lastRows);
        return;
      }
      armed = '';
      armedEvent = null;

      api('POST', '/api/nodes/' + id + '/' + act, {}).then(function (r) {
        setStatus(r.status + ' ' + JSON.stringify(r.body));
        return refresh();
      });
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
